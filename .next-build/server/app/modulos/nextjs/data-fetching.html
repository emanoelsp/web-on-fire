⚡\",\"text\":\"Bônus de performance: o usuário recebe HTML já preenchido — sem spinner inicial, sem cascata de requests.\"}]},{\"id\":3,\"type\":\"code\",\"tag\":\"fetch nativo\",\"title\":\"O padrão fundamental\",\"codeLabel\":\"src/app/produtos/page.tsx\",\"code\":\"// Server Component async — sem useEffect, sem useState\\nexport default async function ProdutosPage() {\\n  const res = await fetch(\\\"https://fakestoreapi.com/products\\\");\\n\\n  if (!res.ok) throw new Error(\\\"Falha ao buscar produtos\\\");\\n\\n  const produtos: Produto[] = await res.json();\\n\\n  return (\\n    \u003cmain\u003e\\n      \u003ch1\u003eCatálogo ({produtos.length})\u003c/h1\u003e\\n      \u003cul\u003e\\n        {produtos.map((p) =\u003e (\\n          \u003cli key={p.id}\u003e{p.title} — R$ {p.price}\u003c/li\u003e\\n        ))}\\n      \u003c/ul\u003e\\n    \u003c/main\u003e\\n  );\\n}\",\"tip\":\"O throw não é descuido: ele aciona o error.tsx mais próximo (assunto da Aula 05). Falha de fetch SEMPRE deve ser tratada.\"},{\"id\":4,\"type\":\"concept\",\"tag\":\"Mock Data\",\"title\":\"Antes da API existir: simule\",\"items\":[{\"icon\":\"🎭\",\"text\":\"Mock data = dados falsos com a MESMA forma dos reais. Você constrói a interface sem esperar o backend.\"},{\"icon\":\"📁\",\"text\":\"Padrão do curso: um arquivo src/lib/mocks.ts com constantes tipadas exportadas.\"},{\"icon\":\"🔌\",\"text\":\"O segredo é a camada de acesso: getProdutos() hoje lê a constante, amanhã chama o Firestore — e as PÁGINAS NÃO MUDAM.\"},{\"icon\":\"🧪\",\"text\":\"É assim que equipes reais trabalham: front e back andam em paralelo, ligados por um contrato de tipos (olá, TypeScript!).\"}]},{\"id\":5,\"type\":\"code\",\"tag\":\"Na prática\",\"title\":\"Mock com contrato de tipos\",\"codeLabel\":\"src/lib/mocks.ts + src/services/produtoService.ts\",\"code\":\"// src/types/produto.ts — o CONTRATO\\nexport interface Produto {\\n  id: number;\\n  nome: string;\\n  preco: number;\\n  categoria: \\\"camisetas\\\" | \\\"canecas\\\" | \\\"adesivos\\\";\\n}\\n\\n// src/lib/mocks.ts — os dados falsos\\nexport const PRODUTOS_MOCK: Produto[] = [\\n  { id: 1, nome: \\\"Camiseta On Fire\\\", preco: 79.9, categoria: \\\"camisetas\\\" },\\n  { id: 2, nome: \\\"Caneca do Dev\\\",    preco: 39.9, categoria: \\\"canecas\\\" },\\n  { id: 3, nome: \\\"Adesivo Event Loop\\\", preco: 9.9, categoria: \\\"adesivos\\\" },\\n];\\n\\n// src/services/produtoService.ts — a CAMADA DE ACESSO\\nexport async function getProdutos(): Promise\u003cProduto[]\u003e {\\n  // simula a latência da rede (remova em produção!)\\n  await new Promise((r) =\u003e setTimeout(r, 300));\\n  return PRODUTOS_MOCK;\\n  // amanhã: return (await fetch(...)).json()  ← a página nem percebe\\n}\",\"tip\":\"Page importa do service, service importa do mock. Quando o dado real chegar, você troca UMA função — não dez páginas.\"},{\"id\":6,\"type\":\"quiz\",\"tag\":\"Quiz\",\"title\":\"Arquitetura de dados\",\"question\":\"Por que buscar dados numa função getProdutos() em vez de dar fetch direto dentro de cada página?\",\"options\":[{\"text\":\"Porque fetch não funciona dentro de page.tsx\",\"correct\":false,\"explanation\":\"Funciona perfeitamente — o slide 3 fez exatamente isso. A questão é arquitetural, não técnica.\"},{\"text\":\"Para trocar a fonte de dados (mock → API → banco) sem tocar nas páginas\",\"correct\":true,\"explanation\":\"Exato! A camada de serviço isola a ORIGEM do dado. Páginas dependem do contrato (tipos), não da fonte.\"},{\"text\":\"Porque funções async só existem em arquivos de serviço\",\"correct\":false,\"explanation\":\"async existe em qualquer lugar — inclusive nos próprios Server Components.\"},{\"text\":\"Para o código ficar maior e mais profissional\",\"correct\":false,\"explanation\":\"Mais arquivos ≠ mais profissional. A camada existe por um motivo concreto: desacoplar fonte e consumo.\"}],\"xp\":15},{\"id\":7,\"type\":\"diagram\",\"tag\":\"Cache\",\"title\":\"As 3 estratégias de cache do fetch\",\"subtitle\":\"Você escolhe a validade de cada dado\",\"layers\":[{\"icon\":\"🧊\",\"label\":\"ESTÁTICO — cache: \\\"force-cache\\\"\",\"desc\":\"Busca 1 vez no build, serve para todos. Ideal: conteúdo que quase não muda (sobre, docs).\",\"color\":\"blue\",\"connector\":\"precisa atualizar de tempos em tempos?\"},{\"icon\":\"⏱️\",\"label\":\"ISR — next: { revalidate: 60 }\",\"desc\":\"Cache válido por N segundos; depois o Next refaz em segundo plano. Ideal: catálogos, rankings.\",\"color\":\"green\",\"connector\":\"precisa ser sempre fresco?\"},{\"icon\":\"🌊\",\"label\":\"DINÂMICO — cache: \\\"no-store\\\"\",\"desc\":\"Busca a cada requisição. Ideal: dashboard do usuário, carrinho, dados pessoais.\",\"color\":\"fire\"}],\"tip\":\"Pergunta-guia: 'quão desatualizado esse dado PODE ficar?' 1 hora? revalidate: 3600. Nem 1 segundo? no-store.\"},{\"id\":8,\"type\":\"code\",\"tag\":\"Cache na prática\",\"title\":\"Os três em código\",\"codeLabel\":\"estrategias.tsx\",\"code\":\"// 🧊 ESTÁTICO — padrão para dados que não mudam\\nconst sobre = await fetch(\\\"https://api.site.com/sobre\\\", {\\n  cache: \\\"force-cache\\\",\\n});\\n\\n// ⏱️ ISR — revalida a cada 60 segundos\\nconst produtos = await fetch(\\\"https://api.site.com/produtos\\\", {\\n  next: { revalidate: 60 },\\n});\\n\\n// 🌊 DINÂMICO — sempre fresco, nunca cacheia\\nconst carrinho = await fetch(\\\"https://api.site.com/carrinho\\\", {\\n  cache: \\\"no-store\\\",\\n});\\n\\n// A página inteira também pode declarar seu comportamento:\\nexport const revalidate = 60;        // ISR na página toda\\nexport const dynamic = \\\"force-dynamic\\\"; // tudo dinâmico\",\"tip\":\"Você já viu isso em ação: a página do Módulo 01 deste site usa dynamic = \\\"force-dynamic\\\" para os bloqueios de aula chegarem na hora.\"},{\"id\":9,\"type\":\"concept\",\"tag\":\"Revalidação\",\"title\":\"E quando o dado muda AGORA?\",\"items\":[{\"icon\":\"🏷️\",\"text\":\"Tags de cache: fetch(url, { next: { tags: [\\\"produtos\\\"] } }) etiqueta a busca.\"},{\"icon\":\"🔫\",\"text\":\"revalidateTag(\\\"produtos\\\"): derruba na hora todo cache com essa etiqueta — chamado após criar/editar um produto.\"},{\"icon\":\"🛤️\",\"text\":\"revalidatePath(\\\"/produtos\\\"): alternativa por rota — atualiza uma página específica.\"},{\"icon\":\"🔮\",\"text\":\"Onde se chama isso? Em Server Actions — o assunto da Aula 04 do Módulo 04, quando os dados começarem a MUDAR de verdade.\"}]},{\"id\":10,\"type\":\"fill-blank\",\"tag\":\"Mão na massa\",\"title\":\"Complete a estratégia\",\"instruction\":\"O placar do jogo precisa atualizar no máximo a cada 30 segundos, sem rebuscar a cada acesso. Complete o valor da opção (digite só a parte que falta):\",\"prefix\":\"const placar = await fetch(url, {\\n  next: { _______________ },\\n});\",\"answer\":\"revalidate: 30\",\"hint\":\"É a opção de ISR: a palavra-chave e o número de segundos.\",\"xp\":20},{\"id\":11,\"type\":\"concept\",\"tag\":\"Boas práticas\",\"title\":\"O checklist do data fetching\",\"items\":[{\"icon\":\"🖥️\",\"text\":\"Busque no servidor por padrão. Fetch no cliente é exceção (dados que mudam com interação, tempo real).\"},{\"icon\":\"🤝\",\"text\":\"Requisições em paralelo: Promise.all([getProdutos(), getCategorias()]) — nunca await em fila sem necessidade.\"},{\"icon\":\"🚨\",\"text\":\"Sempre cheque res.ok e lance erro — o error.tsx existe para isso.\"},{\"icon\":\"📦\",\"text\":\"Tipar a resposta: const dados: Produto[] = await res.json(). Sem tipo, o TypeScript não te protege.\"}]},{\"id\":12,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão 04 · P1\",\"title\":\"LOJA COM\\nMOCK DATA\",\"subtitle\":\"Monte o fluxo de dados completo — do mock ao cache\",\"tasks\":[\"Crie a interface Produto em src/types e o arquivo src/lib/mocks.ts com 6 produtos\",\"Crie src/services/produtoService.ts com getProdutos() e getProdutoById(id) (com latência simulada)\",\"Página /loja: Server Component async listando os produtos via service\",\"Página /loja/[id]: detalhe do produto — n
