  → /blog/meu-post\\n  📁 privacidade/\\n    📄 page.tsx            → /privacidade\\n  📁 termos/\\n    📄 page.tsx            → /termos\",\"tip\":\"Cada pasta é uma decisão de URL pública. Pense primeiro no que o usuário vai digitar no browser.\"},{\"id\":4,\"type\":\"code\",\"tag\":\"Página /sobre\",\"title\":\"Criando uma página de conteúdo\",\"codeLabel\":\"src/app/sobre/page.tsx\",\"tip\":\"export const metadata define o título da aba e a description para SEO — sem bibliotecas extras, nativo do Next.js.\",\"code\":\"import type { Metadata } from \\\"next\\\";\\n\\nexport const metadata: Metadata = {\\n  title: \\\"Sobre nós · MeuSite\\\",\\n  description: \\\"Conheça a história e a missão da nossa empresa.\\\",\\n};\\n\\nexport default function SobrePage() {\\n  return (\\n    \u003cmain style={{ maxWidth: \\\"760px\\\", margin: \\\"0 auto\\\", padding: \\\"4rem 1.5rem\\\" }}\u003e\\n      \u003ch1\u003eSobre nós\u003c/h1\u003e\\n      \u003cp\u003e\\n        Somos uma empresa apaixonada por tecnologia. Fundada em 2020,\\n        nossa missão é simplificar o desenvolvimento web para todos.\\n      \u003c/p\u003e\\n\\n      \u003ch2\u003eNossa equipe\u003c/h2\u003e\\n      \u003cp\u003e\\n        Times distribuídos em 5 países, todos remotos e com foco em\\n        entregar valor real para os nossos clientes.\\n      \u003c/p\u003e\\n    \u003c/main\u003e\\n  );\\n}\"},{\"id\":5,\"type\":\"files\",\"tag\":\"O problema\",\"title\":\"Quando a organização interna não combina com a URL\",\"codeLabel\":\"Cenário: você quer agrupar páginas por tipo\",\"code\":\"// Você quer organizar internamente assim:\\n📁 src/app/\\n  📁 paginas/             ← agrupa conteúdo institucional\\n    📁 sobre/\\n      📄 page.tsx         → URL gerada: /paginas/sobre ❌\\n    📁 contato/\\n      📄 page.tsx         → URL gerada: /paginas/contato ❌\\n\\n// Mas a URL pública que você quer é:\\n//   /sobre     (não /paginas/sobre)\\n//   /contato   (não /paginas/contato)\\n\\n// Duas soluções:\\n// ──────────────────────────────────────\\n// Opção A: Rewrites no next.config.ts\\n//   → mapeia /sobre para /paginas/sobre no servidor\\n//   → mais configuração, mais manutenção\\n//\\n// Opção B: Route Groups com parênteses  ← recomendado\\n//   → app/(institucional)/sobre/page.tsx → URL: /sobre ✅\\n//   → zero configuração, zero restart\"},{\"id\":6,\"type\":\"code\",\"tag\":\"Opção A — Rewrites\",\"title\":\"Rewrites no next.config.ts\",\"codeLabel\":\"next.config.ts\",\"tip\":\"Rewrites são invisíveis ao browser — /sobre no endereço, mas Next.js serve /paginas/sobre internamente.\",\"code\":\"import type { NextConfig } from \\\"next\\\";\\n\\nconst nextConfig: NextConfig = {\\n  async rewrites() {\\n    return [\\n      // /sobre → serve o conteúdo de /paginas/sobre (invisível ao browser)\\n      { source: \\\"/sobre\\\",   destination: \\\"/paginas/sobre\\\" },\\n      { source: \\\"/contato\\\", destination: \\\"/paginas/contato\\\" },\\n\\n      // Com padrão: /p/:slug → /paginas/:slug\\n      // Cobre /p/sobre, /p/contato, /p/qualquer em uma regra só\\n      { source: \\\"/p/:slug\\\", destination: \\\"/paginas/:slug\\\" },\\n    ];\\n  },\\n};\\n\\nexport default nextConfig;\\n// ⚠️ Rewrites exigem restart do servidor de dev (npm run dev)\"},{\"id\":7,\"type\":\"comparison\",\"tag\":\"Rewrite vs Redirect\",\"title\":\"Rewrite não é Redirect — a diferença importa\",\"left\":{\"label\":\"rewrite (invisível)\",\"items\":[\"URL do browser: /sobre\",\"Next.js serve: /paginas/sobre\",\"Usuário não percebe a troca\",\"Browser não navega de novo\",\"Ideal para organização interna\"]},\"right\":{\"label\":\"redirect (visível)\",\"items\":[\"URL do browser: /sobre\",\"Browser recebe 301/302\",\"Browser navega para /paginas/sobre\",\"URL pública muda visivelmente\",\"Ideal para migrar URLs antigas\"]},\"tip\":\"Use rewrite para esconder estrutura interna. Use redirect para redirecionar URLs legadas (ex: /blog-antigo → /blog).\"},{\"id\":8,\"type\":\"code\",\"tag\":\"Opção B — Route Groups\",\"title\":\"Route Groups: a solução nativa (recomendada)\",\"codeLabel\":\"app/ com Route Group — parênteses = sem URL\",\"tip\":\"Parênteses na pasta = Next.js ignora na URL. Organização interna sem afetar URL pública — zero config, zero restart.\",\"code\":\"// Estrutura com Route Group:\\n📁 src/app/\\n  📁 (institucional)/     ← parênteses: NÃO vira segmento de URL\\n    📁 sobre/\\n      📄 page.tsx         → URL: /sobre ✅\\n    📁 contato/\\n      📄 page.tsx         → URL: /contato ✅\\n    📁 privacidade/\\n      📄 page.tsx         → URL: /privacidade ✅\\n  📁 (produto)/           ← outro grupo\\n    📁 blog/\\n      📄 page.tsx         → URL: /blog ✅\\n    📁 precos/\\n      📄 page.tsx         → URL: /precos ✅\\n\\n// A pasta (institucional) existe no seu editor\\n// mas NÃO existe na URL. Zero next.config.ts, zero restart.\\n// Bônus: cada grupo pode ter seu próprio layout.tsx.\"},{\"id\":9,\"type\":\"code\",\"tag\":\"Decisão\",\"title\":\"Qual solução usar? Árvore de decisão\",\"codeLabel\":\"guia rápido\",\"code\":\"// Quero uma URL simples e já sei a estrutura?\\n//   └── Crie a pasta direto: app/sobre/page.tsx → /sobre\\n//       ✅ Mais simples. Comece aqui.\\n\\n// Quero organizar pastas internamente sem mudar a URL pública?\\n//   └── Route Group: app/(institucional)/sobre/page.tsx → /sobre\\n//       ✅ Solução nativa. Zero config. Recomendada.\\n\\n// Quero redirecionar uma URL antiga para uma nova (SEO, migração)?\\n//   └── next.config.ts → redirects()\\n//       { source: \\\"/blog-antigo\\\", destination: \\\"/blog\\\", permanent: true }\\n//       ⚠️ Browser vê a URL nova (visível).\\n\\n// Quero que /publica sirva conteúdo de /outra (proxy invisível)?\\n//   └── next.config.ts → rewrites()\\n//       { source: \\\"/sobre\\\", destination: \\\"/paginas/sobre\\\" }\\n//       ⚠️ Browser vê /sobre, Next.js serve /paginas/sobre.\\n\\n// Preciso rotear para uma API ou servidor externo?\\n//   └── next.config.ts → rewrites() com destination externo\\n//       { source: \\\"/api/:path*\\\", destination: \\\"https://api.meuservidor.com/:path*\\\" }\"},{\"id\":10,\"type\":\"code\",\"tag\":\"Bônus\",\"title\":\"Layout exclusivo por Route Group\",\"codeLabel\":\"app/(institucional)/layout.tsx\",\"tip\":\"Cada Route Group pode ter layout.tsx próprio — sem afetar o RootLayout global nem outras rotas.\",\"code\":\"// app/(institucional)/layout.tsx\\n// Só as páginas dentro de (institucional) recebem este layout\\nexport default function InstitucionalLayout({\\n  children,\\n}: {\\n  children: React.ReactNode;\\n}) {\\n  return (\\n    \u003cdiv\u003e\\n      {/* Barra extra só nas páginas institucionais */}\\n      \u003cdiv style={{ background: \\\"#f5f5f5\\\", padding: \\\"0.5rem 2rem\\\", fontSize: \\\"0.875rem\\\" }}\u003e\\n        📌 Conteúdo institucional\\n      \u003c/div\u003e\\n      \u003cdiv style={{ maxWidth: \\\"900px\\\", margin: \\\"0 auto\\\", padding: \\\"2rem 1.5rem\\\" }}\u003e\\n        {children}\\n      \u003c/div\u003e\\n    \u003c/div\u003e\\n  );\\n}\\n\\n// Resultado:\\n// /sobre    → RootLayout (Header/Footer) + InstitucionalLayout + page.tsx\\n// /blog     → RootLayout (Header/Footer) + page.tsx  (sem InstitucionalLayout)\"},{\"id\":11,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão 05 · P3\",\"title\":\"PÁGINAS E\\nARQUITETURA\\nDE URLs\",\"subtitle\":\"Monte a estrutura de páginas de um site real\",\"tasks\":[\"Crie /sobre/page.tsx com metadata (title e description)\",\"Crie /contato/page.tsx com um formulário simples (só HTML, sem lógica de envio)\",\"Organize /sobre e /contato em um Route Group (institucional) — confirme que as URLs /sobre e /contato continuam funcionando\"],\"bonus\":[\"Adicione um layout.tsx exclusivo para o grupo (institucional) com uma barra extra no topo\",\"Crie um rewrite em next.config.ts: /info → /sobre (e teste no browser)\",\"Crie /blog/page.tsx com lista estática de 3 posts e /blog/[slug]/page.tsx com generateMetadata dinâmica\"],\"nextHref\":\"/m
