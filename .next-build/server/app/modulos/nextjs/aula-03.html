hildren\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L6\",null,{\"slides\":[{\"id\":1,\"type\":\"cover\",\"tag\":\"Módulo 02 · Aula 03\",\"title\":\"SERVER vs\\nCLIENT\\nCOMPONENTS\",\"subtitle\":\"A decisão mais importante do App Router.\"},{\"id\":2,\"type\":\"concept\",\"tag\":\"O problema\",\"title\":\"Por que isso importa tanto?\",\"items\":[{\"icon\":\"📦\",\"text\":\"Todo componente que vai ao client aumenta o bundle JS enviado ao browser.\"},{\"icon\":\"🐌\",\"text\":\"Bundle maior = mais tempo de download, parse e execução — página mais lenta.\"},{\"icon\":\"🔐\",\"text\":\"Lógica no client pode expor segredos e dados sensíveis (tokens, queries de banco).\"},{\"icon\":\"✅\",\"text\":\"RSC resolve tudo: componentes que ficam no servidor, sem JS no bundle do browser.\"}]},{\"id\":3,\"type\":\"definition\",\"tag\":\"Definição\",\"title\":\"O que são React Server Components\",\"quote\":\"RSC são componentes React que rodam exclusivamente no servidor — eles buscam dados, acessam banco de dados e usam segredos, sem nenhum JavaScript sendo enviado ao browser.\",\"highlights\":[\"exclusivamente no servidor\",\"buscam dados, acessam banco de dados e usam segredos\",\"nenhum JavaScript sendo enviado ao browser\"]},{\"id\":4,\"type\":\"comparison\",\"tag\":\"Server vs Client\",\"title\":\"A diferença na prática\",\"left\":{\"label\":\"Server Component (padrão)\",\"items\":[\"Roda no servidor (Node.js)\",\"Zero JS enviado ao browser\",\"Pode ser async/await\",\"Acessa BD, APIs, env vars\",\"Sem useState, useEffect, eventos\"]},\"right\":{\"label\":\"Client Component ('use client')\",\"items\":[\"Roda no browser\",\"JS enviado e executado\",\"Não pode ser async direto\",\"Acessa só APIs do browser\",\"useState, useEffect, onClick...\"]},\"tip\":\"Regra: todo componente é Server por padrão. Só adicione 'use client' quando precisar de interatividade.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"Server Component\",\"title\":\"Buscando dados no servidor\",\"codeLabel\":\"src/app/produtos/page.tsx\",\"tip\":\"Nenhuma linha desse código vai para o browser. O HTML chega pronto — zero JS, zero loading spinner.\",\"code\":\"// Sem 'use client' = Server Component\\n// Este arquivo NUNCA vai para o bundle do browser\\n\\nimport { db } from \\\"@/lib/firebaseConfig\\\";\\nimport { collection, getDocs } from \\\"firebase/firestore\\\";\\n\\nasync function getProdutos() {\\n  // Acesso direto ao Firestore — impossível em Client Component\\n  const snap = await getDocs(collection(db, \\\"produtos\\\"));\\n  return snap.docs.map((d) =\u003e ({ id: d.id, ...d.data() }));\\n}\\n\\nexport default async function ProdutosPage() {\\n  const produtos = await getProdutos(); // await direto!\\n\\n  return (\\n    \u003csection\u003e\\n      \u003ch1\u003eProdutos ({produtos.length})\u003c/h1\u003e\\n      {produtos.map((p) =\u003e (\\n        \u003cdiv key={p.id}\u003e{p.nome}\u003c/div\u003e\\n      ))}\\n    \u003c/section\u003e\\n  );\\n}\"},{\"id\":6,\"type\":\"code\",\"tag\":\"Client Component\",\"title\":\"Interatividade no cliente\",\"codeLabel\":\"src/components/AddToCart.tsx\",\"tip\":\"Use Client Components para o que só o browser pode fazer: clicks, inputs, animações, localStorage, etc.\",\"code\":\"\\\"use client\\\"; // ← marca como Client Component\\n\\nimport { useState } from \\\"react\\\";\\n\\ninterface Props {\\n  productId: string;\\n  price: number;\\n}\\n\\nexport default function AddToCart({ productId, price }: Props) {\\n  const [qty, setQty] = useState(1);\\n  const [added, setAdded] = useState(false);\\n\\n  function handleAdd() {\\n    // Lógica de carrinho no client\\n    const cart = JSON.parse(localStorage.getItem(\\\"cart\\\") ?? \\\"[]\\\");\\n    cart.push({ productId, qty, price });\\n    localStorage.setItem(\\\"cart\\\", JSON.stringify(cart));\\n    setAdded(true);\\n  }\\n\\n  return (\\n    \u003cdiv\u003e\\n      \u003cinput\\n        type=\\\"number\\\"\\n        value={qty}\\n        onChange={(e) =\u003e setQty(Number(e.target.value))}\\n        min={1}\\n      /\u003e\\n      \u003cbutton onClick={handleAdd}\u003e\\n        {added ? \\\"✓ Adicionado!\\\" : \\\"Adicionar ao Carrinho\\\"}\\n      \u003c/button\u003e\\n    \u003c/div\u003e\\n  );\\n}\"},{\"id\":7,\"type\":\"architecture\",\"tag\":\"A fronteira\",\"title\":\"Como server e client se conectam\",\"subtitle\":\"O fluxo de dados entre as duas camadas\",\"steps\":[{\"icon\":\"🖥️\",\"text\":\"Server Component busca dados (Firestore, API, banco)\"},{\"icon\":\"📦\",\"text\":\"Passa dados serializáveis (strings, numbers, objetos) como props ao Client\"},{\"icon\":\"🚫\",\"text\":\"Não pode passar: funções, classes, Maps, Sets — eles não são serializáveis\"},{\"icon\":\"🌐\",\"text\":\"Client Component recebe as props e controla a interatividade\"}],\"tip\":\"Pense assim: Server = buscar e preparar dados. Client = exibir e reagir ao usuário.\"},{\"id\":8,\"type\":\"code\",\"tag\":\"Composição\",\"title\":\"Server + Client na mesma página\",\"codeLabel\":\"src/app/produtos/[id]/page.tsx\",\"code\":\"// Server Component — busca os dados\\nimport { AddToCart } from \\\"@/components/AddToCart\\\"; // Client Component\\n\\nasync function getProduto(id: string) {\\n  // Roda no servidor — pode acessar banco diretamente\\n  return db.collection(\\\"produtos\\\").doc(id).get();\\n}\\n\\nexport default async function ProdutoPage({\\n  params,\\n}: {\\n  params: Promise\u003c{ id: string }\u003e;\\n}) {\\n  const { id } = await params;\\n  const produto = await getProduto(id);\\n\\n  return (\\n    \u003carticle\u003e\\n      \u003ch1\u003e{produto.nome}\u003c/h1\u003e         {/* renderizado no servidor */}\\n      \u003cp\u003e{produto.descricao}\u003c/p\u003e       {/* renderizado no servidor */}\\n\\n      {/* Client Component aninhado: recebe dados serializáveis */}\\n      \u003cAddToCart\\n        productId={produto.id}\\n        price={produto.preco}\\n      /\u003e\\n    \u003c/article\u003e\\n  );\\n}\",\"tip\":\"Você pode aninhar Client Components dentro de Server Components. O contrário (Server dentro de Client) exige a prop children.\"},{\"id\":9,\"type\":\"best-practices\",\"tag\":\"Padrões\",\"title\":\"O que fazer e o que evitar\",\"items\":[{\"icon\":\"✅\",\"text\":\"Use Server Components por padrão — troque para Client só quando necessário.\"},{\"icon\":\"✅\",\"text\":\"Busque dados no Server Component e passe como props ao Client.\"},{\"icon\":\"✅\",\"text\":\"Coloque 'use client' o mais fundo possível na árvore de componentes.\"},{\"icon\":\"❌\",\"text\":\"Evite buscar dados com useEffect — prefira Server Components com fetch.\"},{\"icon\":\"❌\",\"text\":\"Não marque pages inteiras como 'use client' sem necessidade.\"},{\"icon\":\"❌\",\"text\":\"Não passe funções como props de Server para Client — não é serializável.\"}]},{\"id\":10,\"type\":\"concept\",\"tag\":\"Streaming\",\"title\":\"Suspense e Streaming\",\"items\":[{\"icon\":\"⚡\",\"text\":\"Streaming permite enviar HTML em partes — o header aparece antes dos dados carregarem.\"},{\"icon\":\"🔄\",\"text\":\"Suspense define o que mostrar enquanto um componente carrega (fallback).\"},{\"icon\":\"📄\",\"text\":\"loading.tsx é o Suspense automático do App Router para a rota inteira.\"},{\"icon\":\"🎯\",\"text\":\"Use \u003cSuspense fallback={\u003cSkeleton/\u003e}\u003e para controle granular dentro da página.\"}],\"tip\":\"Com Streaming, a página aparece progressivamente — o usuário vê algo imediatamente, mesmo que parte dos dados ainda carregue.\"},{\"id\":11,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão 03\",\"title\":\"SERVER vs CLIENT\\nNA PRÁTICA\",\"subtitle\":\"Identifique e implemente o padrão correto\",\"tasks\":[\"Crie uma página Server Component que lista usuários de uma API pública\",\"Crie um componente SearchBar.tsx com 'use client' e useState\",\"Passe a lista de usuários do Server para o Client como prop\",\"Filtre a lista no client conforme o usuário digita\",\"Certifique-se que o fetch acontece no servidor, não no browser\"],\"bonus\":[\"Adicione um Suspense com fallback de loading enquanto os dados chegam\",\"Crie um componente \u003cUserCard\u003e Server para renderizar cada usuário\"],\"nextHref\":\"/modulos/nextjs/data-fetching\",\"nextLabel\":\"Aula 03: Data Fetching →\"}],\"backHref\":\"/modulos/nextjs\",\"backLabel\":\"Next.js\",\"aulaLabel\":\"Aula 02 · P2 — Server vs Client\",\"aulaSlug\":\"nextjs-aula-03\"}],[\"$L7\"],\"$L8\"]}],{},null,false,null]},null,false,\"$@9\"]},null,false,\"$@9\"]},null,false,\"$@9\"]},null,false,null],\"$La\",false]],\"m\":\"$undefined\",\"G\":[\"$b\",[\"$Lc\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"g-pGVvcGEV9O4jPvRGyfJ\"}\n"])</script><script>self.__next_f.push([1,"d:I[97367,[\"/_next/
