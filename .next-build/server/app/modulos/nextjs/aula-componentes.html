u003cspan\u003e🔥 MeuSite\u003c/span\u003e\\n        \u003cnav\u003e\u003ca href=\\\"/\\\"\u003eInício\u003c/a\u003e \u003ca href=\\\"/sobre\\\"\u003eSobre\u003c/a\u003e\u003c/nav\u003e\\n      \u003c/header\u003e\\n      \u003cmain\u003eConteúdo da home...\u003c/main\u003e\\n    \u003c/\u003e\\n  );\\n}\\n\\n// app/sobre/page.tsx  ← MESMO header copiado\\nexport default function Sobre() {\\n  return (\\n    \u003c\u003e\\n      \u003cheader style={{ padding: \\\"1rem\\\", borderBottom: \\\"1px solid #eee\\\" }}\u003e\\n        \u003cspan\u003e🔥 MeuSite\u003c/span\u003e  {/* ← duplicado */}\\n        \u003cnav\u003e\u003ca href=\\\"/\\\"\u003eInício\u003c/a\u003e \u003ca href=\\\"/sobre\\\"\u003eSobre\u003c/a\u003e\u003c/nav\u003e\\n      \u003c/header\u003e\\n      \u003cmain\u003eConteúdo da página sobre...\u003c/main\u003e\\n    \u003c/\u003e\\n  );\\n}\\n\\n// app/contato/page.tsx  ← MESMO header copiado de novo\\n// ... e assim por diante em cada página\"},{\"id\":3,\"type\":\"concept\",\"tag\":\"A solução\",\"title\":\"Componente reutilizável: crie uma vez, use em qualquer lugar\",\"items\":[{\"icon\":\"🧱\",\"text\":\"Um componente é um bloco de UI com nome — você importa \u003cHeader /\u003e em vez de recopiar o HTML.\"},{\"icon\":\"🔁\",\"text\":\"Muda o logo no Header.tsx → muda em todas as páginas de uma vez, automaticamente.\"},{\"icon\":\"🎛️\",\"text\":\"Props tornam o componente flexível — mesmo componente, comportamentos diferentes por página.\"},{\"icon\":\"📐\",\"text\":\"Regra: se você usou o mesmo JSX mais de uma vez, já é hora de extrair um componente.\"}],\"tip\":\"Componentes reutilizáveis reduzem bugs: corrigir em um lugar corrige em todos.\"},{\"id\":4,\"type\":\"files\",\"tag\":\"Arquitetura\",\"title\":\"Onde ficam os componentes?\",\"codeLabel\":\"src/ — estrutura recomendada\",\"code\":\"📁 src/\\n  📁 app/\\n    📄 layout.tsx        ← importa Header e Footer (uma vez só)\\n    📄 page.tsx\\n    📁 sobre/\\n      📄 page.tsx        ← não precisa importar Header aqui\\n    📁 contato/\\n      📄 page.tsx        ← nem aqui\\n  📁 components/         ← componentes reutilizáveis ficam aqui\\n    📄 Header.tsx        ← cabeçalho do site\\n    📄 Footer.tsx        ← rodapé do site\\n    📄 Navbar.tsx        ← menu de navegação\\n    📁 ui/               ← botões, cards, badges...\\n      📄 Button.tsx\\n      📄 Card.tsx\\n  📁 lib/                ← utilitários, configurações\",\"tip\":\"Pasta components/ na raiz de src/ é a convenção mais comum — todos os devs vão encontrar sem pensar.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"Header\",\"title\":\"Criando o Header\",\"codeLabel\":\"src/components/Header.tsx\",\"tip\":\"Sem 'use client' — Header é Server Component por padrão. Só adicione se precisar de estado ou eventos.\",\"code\":\"import Link from \\\"next/link\\\";\\n\\nexport default function Header() {\\n  return (\\n    \u003cheader\\n      style={{\\n        display: \\\"flex\\\",\\n        alignItems: \\\"center\\\",\\n        justifyContent: \\\"space-between\\\",\\n        padding: \\\"1rem 2rem\\\",\\n        borderBottom: \\\"1px solid #eee\\\",\\n      }}\\n    \u003e\\n      {/* Logo / nome do site */}\\n      \u003cLink href=\\\"/\\\" style={{ fontWeight: 700, fontSize: \\\"1.25rem\\\", textDecoration: \\\"none\\\" }}\u003e\\n        🔥 MeuSite\\n      \u003c/Link\u003e\\n\\n      {/* Navegação principal */}\\n      \u003cnav style={{ display: \\\"flex\\\", gap: \\\"1.5rem\\\" }}\u003e\\n        \u003cLink href=\\\"/\\\"\u003eInício\u003c/Link\u003e\\n        \u003cLink href=\\\"/sobre\\\"\u003eSobre\u003c/Link\u003e\\n        \u003cLink href=\\\"/contato\\\"\u003eContato\u003c/Link\u003e\\n      \u003c/nav\u003e\\n    \u003c/header\u003e\\n  );\\n}\"},{\"id\":6,\"type\":\"code\",\"tag\":\"Footer\",\"title\":\"Criando o Footer com props\",\"codeLabel\":\"src/components/Footer.tsx\",\"tip\":\"Props com valor padrão (companyName = 'MeuSite') — o componente funciona mesmo sem receber a prop.\",\"code\":\"import Link from \\\"next/link\\\";\\n\\ninterface FooterProps {\\n  companyName?: string; // opcional — tem valor padrão\\n}\\n\\nexport default function Footer({ companyName = \\\"MeuSite\\\" }: FooterProps) {\\n  const year = new Date().getFullYear(); // ano sempre atualizado\\n\\n  return (\\n    \u003cfooter\\n      style={{\\n        padding: \\\"2rem\\\",\\n        textAlign: \\\"center\\\",\\n        borderTop: \\\"1px solid #eee\\\",\\n        color: \\\"#666\\\",\\n        fontSize: \\\"0.875rem\\\",\\n      }}\\n    \u003e\\n      \u003cp\u003e© {year} {companyName}. Todos os direitos reservados.\u003c/p\u003e\\n      \u003cnav style={{ marginTop: \\\"0.5rem\\\", display: \\\"flex\\\", justifyContent: \\\"center\\\", gap: \\\"1rem\\\" }}\u003e\\n        \u003cLink href=\\\"/privacidade\\\"\u003ePrivacidade\u003c/Link\u003e\\n        \u003cLink href=\\\"/termos\\\"\u003eTermos\u003c/Link\u003e\\n      \u003c/nav\u003e\\n    \u003c/footer\u003e\\n  );\\n}\\n\\n// Uso sem prop:  \u003cFooter /\u003e  → \\\"© 2025 MeuSite.\\\"\\n// Uso com prop: \u003cFooter companyName=\\\"On Fire Academy\\\" /\u003e\"},{\"id\":7,\"type\":\"code\",\"tag\":\"Navbar ativa\",\"title\":\"Navbar com link destacado\",\"codeLabel\":\"src/components/Navbar.tsx\",\"tip\":\"usePathname() retorna a rota atual ('/sobre', '/blog'...) — compara com href para saber qual link destacar.\",\"code\":\"\\\"use client\\\"; // usePathname precisa do browser\\nimport Link from \\\"next/link\\\";\\nimport { usePathname } from \\\"next/navigation\\\";\\n\\nconst links = [\\n  { href: \\\"/\\\",        label: \\\"Início\\\" },\\n  { href: \\\"/sobre\\\",   label: \\\"Sobre\\\" },\\n  { href: \\\"/blog\\\",    label: \\\"Blog\\\" },\\n  { href: \\\"/contato\\\", label: \\\"Contato\\\" },\\n];\\n\\nexport default function Navbar() {\\n  const pathname = usePathname(); // \\\"/sobre\\\", \\\"/blog\\\"...\\n\\n  return (\\n    \u003cnav style={{ display: \\\"flex\\\", gap: \\\"1rem\\\" }}\u003e\\n      {links.map(({ href, label }) =\u003e (\\n        \u003cLink\\n          key={href}\\n          href={href}\\n          style={{\\n            fontWeight: pathname === href ? 700 : 400,\\n            color: pathname === href ? \\\"#FF5500\\\" : \\\"inherit\\\",\\n            textDecoration: \\\"none\\\",\\n            borderBottom: pathname === href ? \\\"2px solid #FF5500\\\" : \\\"2px solid transparent\\\",\\n            paddingBottom: \\\"2px\\\",\\n          }}\\n        \u003e\\n          {label}\\n        \u003c/Link\u003e\\n      ))}\\n    \u003c/nav\u003e\\n  );\\n}\"},{\"id\":8,\"type\":\"code\",\"tag\":\"layout.tsx\",\"title\":\"Conectando tudo no layout global\",\"codeLabel\":\"src/app/layout.tsx\",\"tip\":\"Header e Footer importados uma vez aqui → aparecem em /sobre, /blog, /contato e em toda rota futura automaticamente.\",\"code\":\"import type { Metadata } from \\\"next\\\";\\nimport Header from \\\"@/components/Header\\\";\\nimport Footer from \\\"@/components/Footer\\\";\\nimport \\\"./globals.css\\\";\\n\\nexport const metadata: Metadata = {\\n  title: \\\"MeuSite\\\",\\n  description: \\\"Descrição do meu site\\\",\\n};\\n\\nexport default function RootLayout({\\n  children,\\n}: {\\n  children: React.ReactNode;\\n}) {\\n  return (\\n    \u003chtml lang=\\\"pt-BR\\\"\u003e\\n      \u003cbody\u003e\\n        \u003cHeader /\u003e                                    {/* ← uma vez */}\\n\\n        \u003cmain style={{ minHeight: \\\"calc(100vh - 160px)\\\" }}\u003e\\n          {children}  {/* /sobre, /blog, /contato... entram aqui */}\\n        \u003c/main\u003e\\n\\n        \u003cFooter companyName=\\\"MeuSite\\\" /\u003e             {/* ← uma vez */}\\n      \u003c/body\u003e\\n    \u003c/html\u003e\\n  );\\n}\"},{\"id\":9,\"type\":\"architecture\",\"tag\":\"O quadro completo\",\"title\":\"Como tudo se encaixa\",\"subtitle\":\"Browser → layout.tsx → página específica\",\"steps\":[{\"icon\":\"🌐\",\"text\":\"Usuário acessa /sobre (ou /blog, /contato — qualquer rota)\"},{\"icon\":\"🏗️\",\"text\":\"Next.js renderiza layout.tsx: \u003cHeader /\u003e + {children} + \u003cFooter /\u003e\"},{\"icon\":\"📄\",\"text\":\"{children} recebe o conteúdo de app/sobre/page.tsx\"},{\"icon\":\"✅\",\"text\":\"Resultado: Header e Footer em todas as páginas — sem repetir uma linha de código\"},{\"icon\":\"🔧\",\"text\":\"Quer mudar o Header? Edita só Header.tsx → muda em todo o site de uma vez\"}],\"tip\":\"Esse é o poder do layout.tsx combinado com componentes: estrutura global, manutenção localizada.\"},{\"id\":10,\"type\":\"best-practices\",\"tag\":\"Boas práticas\",\"title\":\"Regras de ouro de componentes\",\"items\":[{\"icon\":\"✅\",\"text\":\"Um componente = uma responsabilidade. Header faz cabeçalho, não busca dados de usuário.\"},{\"icon\":\"✅\",\"text\":\"Nomes com letra maiúscula: Header, Footer, Navbar — convenção obrigatória do React.\"},{\"icon\":\"✅\",\"text\":\"Arquivo separado por componente — cada componente em seu próprio arquivo.\"},{\"icon\":\"✅\",\"text\":\"Server Component por padrão — só adicione 'use client' se precisar de hooks ou eventos.\"},{\"icon\":\"❌\",\"text\":\"Evite componentes com 300+ linhas. Se cresceu, extraia partes menores.\"},{\"icon\":\"❌\",\"text\":\"Não misture lógica de negócio com UI — componente busca dado OU exibe dado, não os dois.\"}]},{\"id\":11,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão 05 · P2\",\"title\":\"COMPONENTES\\nREUTILIZÁVEIS\",\"subtitle\":\"Construa os blocos estruturais do seu site\",\"tasks\":[\"Crie src/components/Header.tsx com logo e 3 links de navegação usando \u003cLink\u003e\",\"Crie src/components/Footer.tsx com copyright e ano dinâmico (new Date().getFullYear())\",\"Importe Header e Footer no layout.tsx — confirme que /sobre e / mostram o mesmo cabeçalho sem repetir código\"],\"bonus\":[\"Crie src/components/Navbar.tsx com 'use client' e usePathname() para destacar o link da rota atual\",\"Extraia o array de links para uma constante e reutilize em Header e Navbar\"],\"
