tório e deve ter as tags \u003chtml\u003e e \u003cbody\u003e.\"},{\"id\":3,\"type\":\"code\",\"tag\":\"Na prática\",\"title\":\"Layout com providers\",\"codeLabel\":\"src/app/layout.tsx\",\"code\":\"import type { Metadata } from \\\"next\\\";\\nimport { Inter } from \\\"next/font/google\\\";\\nimport { ThemeProvider } from \\\"@/providers/ThemeProvider\\\";\\nimport \\\"./globals.css\\\";\\n\\nconst inter = Inter({ subsets: [\\\"latin\\\"], variable: \\\"--font-sans\\\" });\\n\\nexport const metadata: Metadata = {\\n  title: { default: \\\"Meu App\\\", template: \\\"%s · Meu App\\\" },\\n  description: \\\"Descrição padrão do app\\\",\\n};\\n\\nexport default function RootLayout({\\n  children,\\n}: {\\n  children: React.ReactNode;\\n}) {\\n  return (\\n    \u003chtml lang=\\\"pt-BR\\\" className={inter.variable}\u003e\\n      \u003cbody\u003e\\n        \u003cThemeProvider\u003e      {/* Provider global */}\\n          \u003cHeader /\u003e          {/* Persiste em todas as páginas */}\\n          \u003cmain\u003e{children}\u003c/main\u003e  {/* page.tsx aparece aqui */}\\n          \u003cFooter /\u003e\\n        \u003c/ThemeProvider\u003e\\n      \u003c/body\u003e\\n    \u003c/html\u003e\\n  );\\n}\"},{\"id\":4,\"type\":\"code\",\"tag\":\"Layout aninhado\",\"title\":\"Layout exclusivo por seção\",\"codeLabel\":\"src/app/dashboard/layout.tsx\",\"tip\":\"Layouts aninhados são cumulativos: /dashboard/settings usa RootLayout + DashboardLayout ao mesmo tempo.\",\"code\":\"// Esse layout só aparece em /dashboard/*\\n// src/app/dashboard/layout.tsx\\n\\nexport default function DashboardLayout({\\n  children,\\n}: {\\n  children: React.ReactNode;\\n}) {\\n  return (\\n    \u003cdiv style={{ display: \\\"flex\\\", minHeight: \\\"100vh\\\" }}\u003e\\n      {/* Sidebar só aparece no dashboard */}\\n      \u003caside style={{ width: \\\"260px\\\", borderRight: \\\"1px solid #eee\\\" }}\u003e\\n        \u003cnav\u003e\\n          \u003cLink href=\\\"/dashboard\\\"\u003eVisão Geral\u003c/Link\u003e\\n          \u003cLink href=\\\"/dashboard/alunos\\\"\u003eAlunos\u003c/Link\u003e\\n          \u003cLink href=\\\"/dashboard/cursos\\\"\u003eCursos\u003c/Link\u003e\\n        \u003c/nav\u003e\\n      \u003c/aside\u003e\\n\\n      {/* Conteúdo de cada page.tsx aparece aqui */}\\n      \u003cmain style={{ flex: 1, padding: \\\"2rem\\\" }}\u003e\\n        {children}\\n      \u003c/main\u003e\\n    \u003c/div\u003e\\n  );\\n}\"},{\"id\":5,\"type\":\"concept\",\"tag\":\"loading.tsx\",\"title\":\"Loading automático com Suspense\",\"items\":[{\"icon\":\"⏳\",\"text\":\"loading.tsx é exibido automaticamente enquanto a page.tsx está carregando.\"},{\"icon\":\"✨\",\"text\":\"O Next.js embrulha a página em um \u003cSuspense\u003e automaticamente — você não precisa fazer nada.\"},{\"icon\":\"🎨\",\"text\":\"Use para criar skeletons, spinners, ou qualquer UI de loading.\"},{\"icon\":\"🏗️\",\"text\":\"O layout e a navegação aparecem imediatamente — só o conteúdo fica pendente.\"}],\"tip\":\"Com loading.tsx, o usuário nunca vê uma tela em branco. A navbar e o layout aparecem de imediato.\"},{\"id\":6,\"type\":\"code\",\"tag\":\"loading.tsx\",\"title\":\"Skeleton de loading\",\"codeLabel\":\"src/app/produtos/loading.tsx\",\"code\":\"// Exibido AUTOMATICAMENTE enquanto page.tsx carrega\\n// Não precisa de 'use client' — é Server Component\\n\\nexport default function Loading() {\\n  return (\\n    \u003cdiv\u003e\\n      \u003ch1 style={{ color: \\\"transparent\\\", background: \\\"#e5e7eb\\\",\\n                   borderRadius: \\\"8px\\\", width: \\\"200px\\\" }}\u003e\\n        \u0026nbsp;\\n      \u003c/h1\u003e\\n\\n      {/* Skeleton cards */}\\n      {[1, 2, 3].map((i) =\u003e (\\n        \u003cdiv key={i} style={{\\n          height: \\\"120px\\\",\\n          background: \\\"#f3f4f6\\\",\\n          borderRadius: \\\"12px\\\",\\n          marginBottom: \\\"1rem\\\",\\n          animation: \\\"pulse 2s infinite\\\",\\n        }} /\u003e\\n      ))}\\n    \u003c/div\u003e\\n  );\\n}\\n\\n// Você também pode usar Suspense manual para partes da página:\\n// \u003cSuspense fallback={\u003cLoading /\u003e}\u003e\\n//   \u003cComponenteLento /\u003e\\n// \u003c/Suspense\u003e\"},{\"id\":7,\"type\":\"concept\",\"tag\":\"error.tsx\",\"title\":\"Error Boundary automático\",\"items\":[{\"icon\":\"🛡️\",\"text\":\"error.tsx captura erros de renderização em Server e Client Components automaticamente.\"},{\"icon\":\"🔁\",\"text\":\"Recebe a prop reset() — permite o usuário tentar novamente sem recarregar a página.\"},{\"icon\":\"⚠️\",\"text\":\"Deve ser um Client Component (precisa de interatividade para o botão de retry).\"},{\"icon\":\"📍\",\"text\":\"Cada pasta pode ter seu próprio error.tsx — o erro é capturado no nível mais próximo.\"}],\"tip\":\"error.tsx não captura erros no próprio layout.tsx — para isso, use o global-error.tsx na raiz do /app.\"},{\"id\":8,\"type\":\"code\",\"tag\":\"error.tsx\",\"title\":\"Error boundary na prática\",\"codeLabel\":\"src/app/produtos/error.tsx\",\"code\":\"\\\"use client\\\"; // obrigatório — precisa do botão onClick\\n\\nimport { useEffect } from \\\"react\\\";\\n\\nexport default function Error({\\n  error,\\n  reset,\\n}: {\\n  error: Error \u0026 { digest?: string };\\n  reset: () =\u003e void;  // retry automático do Next.js\\n}) {\\n  useEffect(() =\u003e {\\n    // Log para serviço de monitoramento (Sentry, etc.)\\n    console.error(\\\"Erro na rota /produtos:\\\", error);\\n  }, [error]);\\n\\n  return (\\n    \u003cdiv style={{ textAlign: \\\"center\\\", padding: \\\"4rem\\\" }}\u003e\\n      \u003ch2\u003eAlgo deu errado!\u003c/h2\u003e\\n      \u003cp style={{ color: \\\"#666\\\", marginBottom: \\\"1.5rem\\\" }}\u003e\\n        {error.message ?? \\\"Erro inesperado. Tente novamente.\\\"}\\n      \u003c/p\u003e\\n      \u003cbutton onClick={reset}\u003e\\n        Tentar novamente\\n      \u003c/button\u003e\\n    \u003c/div\u003e\\n  );\\n}\"},{\"id\":9,\"type\":\"concept\",\"tag\":\"Metadata API\",\"title\":\"SEO sem esforço\",\"items\":[{\"icon\":\"📊\",\"text\":\"Metadata API substitui tags \u003cmeta\u003e manuais — mais simples, TypeScript, e automático.\"},{\"icon\":\"🔒\",\"text\":\"Static: export const metadata = { title: 'Produtos' } — definido em build time.\"},{\"icon\":\"⚡\",\"text\":\"Dynamic: generateMetadata({ params }) — calculado com dados reais em runtime.\"},{\"icon\":\"🌐\",\"text\":\"Suporta: title, description, openGraph, twitter, robots, canonical, e muito mais.\"}],\"tip\":\"Use o template do title: { default: 'App', template: '%s · App' } para automatizar o formato de todos os títulos.\"},{\"id\":10,\"type\":\"code\",\"tag\":\"Metadata\",\"title\":\"Metadata estática e dinâmica\",\"codeLabel\":\"src/app/produtos/[id]/page.tsx\",\"code\":\"import type { Metadata } from \\\"next\\\";\\n\\n// Metadata DINÂMICA — gerada com dados reais\\nexport async function generateMetadata({\\n  params,\\n}: {\\n  params: Promise\u003c{ id: string }\u003e;\\n}): Promise\u003cMetadata\u003e {\\n  const { id } = await params;\\n  const produto = await fetch(`/api/produtos/${id}`).then(r =\u003e r.json());\\n\\n  return {\\n    title: produto.nome,  // template do RootLayout é aplicado aqui\\n    description: produto.descricao,\\n    openGraph: {\\n      title: produto.nome,\\n      description: produto.descricao,\\n      images: [{ url: produto.imagem, width: 1200, height: 630 }],\\n    },\\n    // SEO avançado\\n    alternates: { canonical: `https://seusite.com/produtos/${id}` },\\n  };\\n}\\n\\nexport default async function ProdutoPage({ params }) {\\n  // ...mesma página, a metadata é gerada separadamente\\n}\"},{\"id\":11,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão 08\",\"title\":\"UX\\nCOMPLETA\",\"subtitle\":\"Implemente a experiência de usuário profissional\",\"tasks\":[\"Crie um /dashboard/layout.tsx com sidebar de navegação\",\"Adicione /dashboard/loading.tsx com skeleton de cards\",\"Adicione /dashboard/error.tsx com botão 'Te
