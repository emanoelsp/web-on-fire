máquina do usuário.\"},{\"icon\":\"🛡️\",\"text\":\"TypeScript adiciona tipagem ESTÁTICA: os tipos são verificados ANTES de rodar, ainda no editor.\"}]},{\"id\":3,\"type\":\"definition\",\"tag\":\"Definição\",\"title\":\"TypeScript em uma frase\",\"quote\":\"TypeScript é um superconjunto do JavaScript que adiciona tipos estáticos: todo código JS válido é TS válido, e o compilador remove os tipos e gera JavaScript puro no final.\",\"highlights\":[\"superconjunto do JavaScript\",\"tipos estáticos\",\"gera JavaScript puro\"],\"tip\":\"O navegador e o Node não executam TypeScript — executam o JavaScript gerado. Os tipos existem só em tempo de desenvolvimento.\"},{\"id\":4,\"type\":\"comparison\",\"tag\":\"Dinâmica vs Estática\",\"title\":\"As duas filosofias de tipagem\",\"left\":{\"label\":\"Dinâmica (JS puro)\",\"items\":[\"O tipo vive no VALOR, em runtime\",\"Erros aparecem só ao executar\",\"let x = 5; x = \\\"oi\\\" — tudo bem!\",\"Refatorar é andar no escuro\",\"Autocomplete limitado no editor\"]},\"right\":{\"label\":\"Estática (TypeScript)\",\"items\":[\"O tipo vive na VARIÁVEL, no código\",\"Erros aparecem enquanto você digita\",\"x = \\\"oi\\\" → erro: era number!\",\"Refatorar com rede de proteção\",\"Autocomplete que parece mágica\"]},\"tip\":\"Estudos em grandes bases de código estimam que ~15% dos bugs de JavaScript seriam pegos pelo TypeScript antes do deploy.\"},{\"id\":14,\"type\":\"flow\",\"tag\":\"Modelo mental\",\"title\":\"Onde o erro é pego: compilação vs runtime\",\"subtitle\":\"O TypeScript puxa a descoberta do bug para a esquerda da linha do tempo\",\"nodes\":[{\"icon\":\"✍️\",\"label\":\"VOCÊ ESCREVE\",\"desc\":\"TypeScript no editor, com um bug de tipo (ex.: xp: \\\"dez\\\").\",\"color\":\"neutral\"},{\"icon\":\"🛡️\",\"label\":\"TSC VERIFICA\",\"desc\":\"O compilador confere os tipos na hora, enquanto você digita.\",\"color\":\"blue\"},{\"icon\":\"🐛\",\"label\":\"BUG BARRADO\",\"desc\":\"Erro em vermelho no editor — antes de rodar uma linha.\",\"color\":\"amber\"},{\"icon\":\"✅\",\"label\":\"VIRA JS E RODA\",\"desc\":\"Só o código que passou na checagem chega ao navegador/Node.\",\"color\":\"green\"}],\"tip\":\"Sem TypeScript, o mesmo bug passaria batido e só apareceria em RUNTIME — muitas vezes em produção, com o usuário na frente. Isso é o 'shift left': descobrir o erro o mais cedo possível.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"Primitivos\",\"title\":\"Os tipos que você usa todo dia\",\"codeLabel\":\"primitivos.ts\",\"code\":\"// Anotação explícita: variável ':' tipo\\nconst nome: string = \\\"Ana\\\";\\nconst idade: number = 22;\\nconst ativo: boolean = true;\\nconst tags: string[] = [\\\"node\\\", \\\"typescript\\\"];\\n\\n// Mas o TS é esperto: INFERÊNCIA de tipos\\nconst curso = \\\"Web On Fire\\\";   // já sabe que é string\\nconst nota = 9.5;              // já sabe que é number\\n\\n// União de tipos: \\\"um OU outro\\\"\\nlet id: string | number = 42;\\nid = \\\"abc-42\\\";                 // ✅ ok, string também vale\\n\\n// O especial: null e undefined são tipos!\\nlet apelido: string | null = null;\",\"tip\":\"Regra de ouro: deixe a inferência trabalhar. Anote tipos onde eles não são óbvios — parâmetros de função e retornos, principalmente.\"},{\"id\":6,\"type\":\"code\",\"tag\":\"Interfaces\",\"title\":\"Interface: o contrato dos objetos\",\"codeLabel\":\"interfaces.ts\",\"code\":\"// Descreve a FORMA que um objeto deve ter\\ninterface Aluno {\\n  nome: string;\\n  email: string;\\n  xp: number;\\n  badges: string[];\\n  githubUrl?: string;   // '?' = opcional\\n}\\n\\n// Agora o TS fiscaliza o contrato:\\nconst ana: Aluno = {\\n  nome: \\\"Ana\\\",\\n  email: \\\"ana@email.com\\\",\\n  xp: 350,\\n  badges: [\\\"primeira_faisca\\\"],\\n};  // ✅ githubUrl pode faltar (é opcional)\\n\\nfunction apresentar(aluno: Aluno) {\\n  // autocomplete completo de aluno. aqui dentro!\\n  return `${aluno.nome} tem ${aluno.xp} XP`;\\n}\",\"tip\":\"É exatamente assim neste site: os slides que você está vendo seguem interfaces como CoverSlide e QuizSlide em src/types/slides.ts.\"},{\"id\":7,\"type\":\"code\",\"tag\":\"Type Aliases\",\"title\":\"Type: apelidos para qualquer tipo\",\"codeLabel\":\"types.ts\",\"code\":\"// type dá nome a QUALQUER tipo — não só objetos\\ntype ID = string | number;\\n\\n// Uniões literais: só valores específicos!\\ntype Dificuldade = \\\"facil\\\" | \\\"medio\\\" | \\\"dificil\\\";\\n\\ntype Atividade = {\\n  id: ID;\\n  titulo: string;\\n  dificuldade: Dificuldade;\\n};\\n\\nconst quiz: Atividade = {\\n  id: 1,\\n  titulo: \\\"Quiz de Node\\\",\\n  dificuldade: \\\"medio\\\",     // \\\"media\\\" seria ERRO ✋\\n};\\n\\n// interface ou type? Para objetos, os dois funcionam.\\n// Convenção comum: interface para objetos/contratos,\\n// type para uniões, aliases e combinações.\",\"tip\":\"Uniões literais como \\\"facil\\\" | \\\"medio\\\" | \\\"dificil\\\" eliminam categorias inteiras de bugs de digitação — o editor só aceita (e sugere) os valores válidos.\"},{\"id\":8,\"type\":\"quiz\",\"tag\":\"Quiz\",\"title\":\"Pegue o erro\",\"question\":\"Com type Status = \\\"ativo\\\" | \\\"inativo\\\", o que acontece com: const s: Status = \\\"Ativo\\\"; (com A maiúsculo)?\",\"options\":[{\"text\":\"Funciona — TypeScript ignora maiúsculas\",\"correct\":false,\"explanation\":\"Tipos literais são exatos: \\\"Ativo\\\" e \\\"ativo\\\" são strings diferentes.\"},{\"text\":\"Erro em runtime, quando o código rodar\",\"correct\":false,\"explanation\":\"Esse é o comportamento do JS puro! O TypeScript pega ANTES: o código nem compila.\"},{\"text\":\"Erro de compilação, antes mesmo de rodar\",\"correct\":true,\"explanation\":\"Exato! O compilador avisa na hora: Type '\\\"Ativo\\\"' is not assignable to type 'Status'. Bug morto no nascimento.\"},{\"text\":\"O valor vira undefined silenciosamente\",\"correct\":false,\"explanation\":\"TypeScript nunca altera valores — ele só verifica. Quem atribui é você; ele barra o que não encaixa.\"}],\"xp\":15},{\"id\":9,\"type\":\"code\",\"tag\":\"Asserções\",\"title\":\"Asserções: quando você sabe mais que o TS\",\"codeLabel\":\"assercoes.ts\",\"code\":\"// 'as' — afirma um tipo mais específico\\nconst dados = JSON.parse(texto) as Aluno;\\n// JSON.parse retorna 'any'; você garante que é Aluno\\n\\n// Caso clássico no DOM:\\nconst input = document.querySelector(\\\"#email\\\") as HTMLInputElement;\\ninput.value = \\\"ana@email.com\\\";  // sem o 'as', .value seria erro\\n\\n// '!' — afirma \\\"isso não é null\\\"\\nconst botao = document.querySelector(\\\"button\\\")!;\\n\\n// ⚠️ CUIDADO: asserção é uma PROMESSA sua, não uma verificação.\\n// Se o JSON não for um Aluno de verdade... o erro volta pro runtime.\\nconst x = \\\"texto\\\" as unknown as number;  // compila... e mente. 🙈\",\"tip\":\"Asserção não converte nada — só cala o compilador. Use pouco e prefira validar os dados de verdade (na dúvida, verifique com typeof/in).\"},{\"id\":10,\"type\":\"code\",\"tag\":\"Generics\",\"title\":\"Generics: tipos que recebem tipos\",\"codeLabel\":\"generics.ts\",\"code\":\"// O problema: uma função que serve para VÁRIOS tipos\\nfunction primeiro\u003cT\u003e(lista: T[]): T | undefined {\\n  return lista[0];\\n}\\n\\nconst n = primeiro([10, 20, 30]);        // n é number\\nconst s = primeiro([\\\"a\\\", \\\"b\\\", \\\"c\\\"]);     // s é string\\n// mesmo código, tipo preservado — sem any!\\n\\n// Você já usa generics sem perceber:\\nconst nomes: Array\u003cstring\u003e = [\\\"Ana\\\", \\\"Bia\\\"];\\nconst resposta: Promise\u003cAluno\u003e = buscarAluno(1);\\nconst [xp, setXp] = useState\u003cnumber\u003e(0);   // React!\\n\\n// Utilitários prontos do TS:\\ntype AlunoParcial  = Partial\u003cAluno\u003e;  // tudo opcional\\ntype SoLeitura     = Readonly\u003cAluno\u003e; // nada muda\\ntype SemEmail      = Omit\u003cAluno, \\\"email\\\"\u003e;\\ntype SoNomeEXp     = Pick\u003cAluno, \\\"nome\\\" | \\\"xp\\\"\u003e;\",\"tip\":\"Leia \u003cT\u003e como 'um tipo a definir'. Quem chama a função
