co completo, volta no tempo e trabalho paralelo seguro.\"}]},{\"id\":3,\"type\":\"definition\",\"tag\":\"Definição\",\"title\":\"Git em uma frase\",\"quote\":\"Git é um sistema de versionamento distribuído que registra fotografias (commits) do seu projeto ao longo do tempo — cada desenvolvedor tem o histórico completo na própria máquina.\",\"highlights\":[\"versionamento distribuído\",\"fotografias (commits)\",\"histórico completo\"],\"tip\":\"Distribuído = sem servidor central obrigatório. O GitHub é um ponto de encontro na nuvem, mas seu .git local tem TUDO.\"},{\"id\":4,\"type\":\"concept\",\"tag\":\"Git ≠ GitHub\",\"title\":\"Uma dupla, dois papéis\",\"items\":[{\"icon\":\"🧰\",\"text\":\"Git: a FERRAMENTA. Roda no seu terminal, offline, criada por Linus Torvalds em 2005 para o kernel do Linux.\"},{\"icon\":\"☁️\",\"text\":\"GitHub: o SERVIÇO. Hospeda repositórios Git na nuvem e adiciona o social: Pull Requests, Issues, revisão de código.\"},{\"icon\":\"🔁\",\"text\":\"Alternativas ao GitHub: GitLab, Bitbucket. O Git por baixo é o mesmo — os comandos não mudam.\"},{\"icon\":\"💼\",\"text\":\"Seu perfil no GitHub é seu portfólio vivo: recrutadores olham seus repositórios e seus commits.\"}]},{\"id\":5,\"type\":\"diagram\",\"tag\":\"As 3 áreas\",\"title\":\"O caminho de toda mudança\",\"subtitle\":\"Do arquivo editado até a história oficial\",\"layers\":[{\"icon\":\"📝\",\"label\":\"WORKING DIRECTORY\",\"desc\":\"Seus arquivos como estão agora — a bancada de trabalho\",\"color\":\"neutral\",\"connector\":\"git add (escolhe o que entra na foto)\"},{\"icon\":\"📦\",\"label\":\"STAGING AREA\",\"desc\":\"A área de preparação: mudanças selecionadas para o próximo commit\",\"color\":\"amber\",\"connector\":\"git commit -m \\\"mensagem\\\"\"},{\"icon\":\"📸\",\"label\":\"REPOSITÓRIO LOCAL (.git)\",\"desc\":\"A história oficial: cada commit é uma fotografia permanente\",\"color\":\"fire\",\"connector\":\"git push (publica)\"},{\"icon\":\"☁️\",\"label\":\"GITHUB (REMOTO)\",\"desc\":\"A cópia na nuvem que a equipe inteira compartilha\",\"color\":\"green\"}],\"loopBack\":\"git pull traz de volta o que a equipe publicou\",\"tip\":\"Decore o ciclo: edita → add → commit → push. E ao chegar para trabalhar: pull primeiro, sempre.\"},{\"id\":6,\"type\":\"code\",\"tag\":\"Na prática\",\"title\":\"Seu primeiro repositório\",\"codeLabel\":\"terminal\",\"code\":\"# 1. Transforme a pasta em repositório\\ngit init\\n\\n# 2. Configure sua identidade (uma vez só)\\ngit config --global user.name  \\\"Ana Silva\\\"\\ngit config --global user.email \\\"ana@email.com\\\"\\n\\n# 3. Veja o estado das coisas (use SEM MODERAÇÃO)\\ngit status\\n\\n# 4. Prepare e fotografe\\ngit add .                          # tudo para a staging\\ngit commit -m \\\"feat: primeira versão do projeto\\\"\\n\\n# 5. Conecte ao GitHub e publique\\ngit remote add origin https://github.com/ana/meu-projeto.git\\ngit push -u origin main\",\"tip\":\"Mensagem de commit boa diz O QUE e POR QUÊ: 'feat: adiciona login com Google' conta uma história; 'mudanças' não conta nada.\"},{\"id\":7,\"type\":\"quiz\",\"tag\":\"Quiz\",\"title\":\"O ciclo na cabeça\",\"question\":\"Você editou 3 arquivos e quer registrar só 1 deles no próximo commit. Qual é a sequência certa?\",\"options\":[{\"text\":\"git commit -m \\\"...\\\" direto — o Git pergunta quais arquivos incluir\",\"correct\":false,\"explanation\":\"O commit não pergunta nada: ele fotografa o que está na staging area. Se ela estiver vazia, nada acontece.\"},{\"text\":\"git add arquivo.ts e depois git commit -m \\\"...\\\"\",\"correct\":true,\"explanation\":\"Isso! O add seleciona o que entra na foto — é exatamente para isso que a staging area existe: commits precisos.\"},{\"text\":\"git push arquivo.ts — o push envia o arquivo\",\"correct\":false,\"explanation\":\"O push publica COMMITS já feitos no remoto. Sem add + commit antes, não há nada para enviar.\"},{\"text\":\"git add . sempre — não dá para escolher arquivos\",\"correct\":false,\"explanation\":\"Dá sim: git add aceita arquivos específicos. O ponto (.) é só o atalho para 'tudo'.\"}],\"xp\":15},{\"id\":8,\"type\":\"diagram\",\"tag\":\"Branches\",\"title\":\"Branches: universos paralelos\",\"subtitle\":\"Desenvolva sem medo de quebrar o que funciona\",\"layers\":[{\"icon\":\"🌳\",\"label\":\"MAIN\",\"desc\":\"A linha principal: sempre estável, sempre funcionando\",\"color\":\"green\",\"connector\":\"git switch -c minha-feature (cria o universo paralelo)\"},{\"icon\":\"🌿\",\"label\":\"BRANCH DE FEATURE\",\"desc\":\"Sua cópia isolada: commits à vontade, sem afetar a main\",\"color\":\"fire\",\"connector\":\"Pull Request no GitHub (revisão da equipe)\"},{\"icon\":\"🔀\",\"label\":\"MERGE\",\"desc\":\"Aprovado? As mudanças se juntam de volta à main\",\"color\":\"blue\"}],\"loopBack\":\"e o ciclo recomeça na próxima feature\",\"tip\":\"Regra de equipe: NUNCA se trabalha direto na main. Cada tarefa nasce numa branch e volta via Pull Request revisado.\"},{\"id\":13,\"type\":\"branch\",\"tag\":\"Branches\",\"title\":\"O grafo de commits, visualmente\",\"subtitle\":\"Cada bolinha é um commit. A feature nasce da main e volta pelo merge.\",\"mainLabel\":\"main\",\"featureLabel\":\"feature/sobre\",\"mainCommits\":[\"init\",\"home\"],\"featureCommits\":[\"sobre.md\",\"ajuste\"],\"mergeLabel\":\"merge (PR)\",\"tailCommits\":[\"segue\"],\"note\":\"É exatamente o desenho que git log --oneline --graph --all mostra no terminal.\",\"tip\":\"A main (laranja) nunca para de existir; a feature (azul) é um caminho paralelo que diverge e, depois do Pull Request, se junta de volta no commit de merge (verde).\"},{\"id\":9,\"type\":\"code\",\"tag\":\"Conflitos\",\"title\":\"O temido conflito (que não morde)\",\"codeLabel\":\"conflito em Navbar.tsx\",\"code\":\"# Você e um colega mudaram A MESMA linha. No merge:\\n# CONFLICT (content): Merge conflict in Navbar.tsx\\n\\n# O Git marca o arquivo assim:\\n\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD\\n  \u003ch1\u003eWeb On Fire Academy\u003c/h1\u003e\\n=======\\n  \u003ch1\u003eAcademia Web On Fire 🔥\u003c/h1\u003e\\n\u003e\u003e\u003e\u003e\u003e\u003e\u003e minha-feature\\n\\n# Resolver = EDITAR o arquivo:\\n# 1. Escolha uma versão (ou combine as duas)\\n# 2. APAGUE as linhas \u003c\u003c\u003c\u003c\u003c\u003c\u003c ======= \u003e\u003e\u003e\u003e\u003e\u003e\u003e\\n  \u003ch1\u003eWeb On Fire Academy 🔥\u003c/h1\u003e\\n\\n# 3. Marque como resolvido e conclua:\\ngit add Navbar.tsx\\ngit commit -m \\\"merge: resolve conflito no título da navbar\\\"\",\"tip\":\"Conflito não é erro — é o Git sendo honesto: 'duas pessoas mudaram a mesma linha, um humano decide'. O VS Code mostra botões para escolher cada lado.\"},{\"id\":10,\"type\":\"concept\",\"tag\":\"Fluxo em equipe\",\"title\":\"O GitHub Flow — como equipes reais trabalham\",\"items\":[{\"icon\":\"1️⃣\",\"text\":\"git pull na main — comece o dia sincronizado com a equipe.\"},{\"icon\":\"2️⃣\",\"text\":\"git switch -c feature/tela-login — uma branch por tarefa, nome descritivo.\"},{\"icon\":\"3️⃣\",\"text\":\"Commits pequenos e frequentes — cada um é um ponto de restauração.\"},{\"icon\":\"4️⃣\",\"text\":\"Push + Pull Request — descreva o que fez; colegas revisam e comentam no código.\"},{\"icon\":\"5️⃣\",\"text\":\"Merge na main e branch apagada — tarefa entregue, história limpa.\"}],\"tip\":\"É este fluxo que você vai usar nos trabalhos em dupla do curso — e nas empresas. PR sem revisão não entra.\"},{\"id\":11,\"type\":\"fill-blank\",\"tag\":\"Mão na massa\",\"title\":\"Complete o comando\",\"instruction\":\"Complete o comando que registra a fotografia das mudanças preparadas, com a mensagem dada (digite o comando até antes da mensagem):\",\"prefix\":\"$$ git add .\\n$ ______________ \\\"feat: adiciona pagina de perfil\\\"\",\"answer\":\"git commit -m\",\"hint\":\"É o comando que fotografa a staging area — com a flag de mensagem.\",\"xp\":20},{\"id\":12,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão Git\",\"title\":\"MÁQUINA\\nDO T
