ren\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L6\",null,{\"slides\":[{\"id\":1,\"type\":\"cover\",\"tag\":\"Módulo 01 · Aula 01 · Parte 2\",\"title\":\"COMO O NODE\\nFUNCIONA\",\"subtitle\":\"Uma thread só. Milhares de conexões. O segredo é nunca ficar parado.\"},{\"id\":2,\"type\":\"concept\",\"tag\":\"O problema\",\"title\":\"Como servidores tradicionais atendem\",\"items\":[{\"icon\":\"🧵\",\"text\":\"Modelo clássico (Apache/PHP, Java): cada cliente ganha uma thread — um 'funcionário' exclusivo até a resposta sair.\"},{\"icon\":\"🕐\",\"text\":\"Esse funcionário passa a maior parte do tempo esperando: banco de dados, leitura de disco, resposta da rede...\"},{\"icon\":\"💸\",\"text\":\"Threads são caras: cada uma consome memória, e o sistema perde tempo trocando entre elas (context switch).\"},{\"icon\":\"🚨\",\"text\":\"10 mil conexões simultâneas? 10 mil threads. O servidor sufoca — é o famoso problema C10K que motivou o Node.\"}]},{\"id\":3,\"type\":\"concept\",\"tag\":\"A analogia\",\"title\":\"O restaurante Node.js\",\"subtitle\":\"Grave esta cena: ela explica todo o resto da aula.\",\"items\":[{\"icon\":\"🤵\",\"text\":\"Um único garçom (a thread do Node) atende TODAS as mesas do salão.\"},{\"icon\":\"📝\",\"text\":\"Ele anota o pedido e entrega na cozinha — e NÃO fica parado esperando o prato ficar pronto.\"},{\"icon\":\"🍳\",\"text\":\"A cozinha (sistema operacional + libuv) prepara vários pratos ao mesmo tempo.\"},{\"icon\":\"🔔\",\"text\":\"Prato pronto? A cozinha toca o sino, o pedido entra na fila de entrega, e o garçom entrega assim que puder.\"}],\"tip\":\"O garçom nunca cozinha e nunca espera. Ele só anota, entrega e circula. Por isso um garçom só dá conta do salão inteiro.\"},{\"id\":4,\"type\":\"diagram\",\"tag\":\"Event Loop\",\"title\":\"O ciclo do garçom\",\"subtitle\":\"A mesma cena, agora com os nomes técnicos\",\"layers\":[{\"icon\":\"📞\",\"label\":\"REQUISIÇÃO CHEGA\",\"desc\":\"Mesa 7 pede: 'leia o arquivo clientes.json'\",\"color\":\"fire\",\"connector\":\"o garçom anota e delega\"},{\"icon\":\"🍳\",\"label\":\"LIBUV / SISTEMA OPERACIONAL\",\"desc\":\"A cozinha: lê o disco, consulta a rede — sem ocupar o garçom\",\"color\":\"blue\",\"connector\":\"prato pronto! 🔔 o callback entra na fila\"},{\"icon\":\"📋\",\"label\":\"CALLBACK QUEUE\",\"desc\":\"A fila de entregas: callbacks prontos esperando a vez\",\"color\":\"amber\",\"connector\":\"quando a thread está livre\"},{\"icon\":\"⚡\",\"label\":\"EVENT LOOP\",\"desc\":\"O garçom: pega o próximo da fila e executa o callback\",\"color\":\"green\"}],\"loopBack\":\"e volta ao início — milhões de vezes por segundo\",\"tip\":\"Event loop = laço de eventos. É literalmente um loop infinito que pergunta: 'tem callback pronto na fila? Executa. Não tem? Verifica de novo.'\"},{\"id\":14,\"type\":\"flow\",\"tag\":\"Modelo mental\",\"title\":\"O event loop, sem analogia\",\"subtitle\":\"Os quatro estágios que todo dev Node precisa reconhecer\",\"nodes\":[{\"icon\":\"📥\",\"label\":\"CALL STACK\",\"desc\":\"A pilha: executa uma tarefa por vez, de cima para baixo. Só ela roda seu código.\",\"color\":\"fire\"},{\"icon\":\"🧵\",\"label\":\"NODE APIs / LIBUV\",\"desc\":\"Recebe o I/O (timers, arquivos, rede) e trabalha em segundo plano, fora da pilha.\",\"color\":\"blue\"},{\"icon\":\"📋\",\"label\":\"CALLBACK QUEUE\",\"desc\":\"Terminou? O callback entra na fila e espera a vez.\",\"color\":\"amber\"},{\"icon\":\"🔄\",\"label\":\"EVENT LOOP\",\"desc\":\"Pilha vazia? Pega o próximo da fila e devolve para a Call Stack.\",\"color\":\"green\"}],\"cycle\":true,\"cycleLabel\":\"a cada volta, o Event Loop devolve o callback para a Call Stack — milhões de vezes por segundo\",\"tip\":\"Regra de ouro: o Event Loop só entrega o próximo callback quando a Call Stack está VAZIA. Por isso todo o código síncrono roda antes de qualquer callback — mesmo com setTimeout(…, 0). É exatamente o que o próximo quiz testa.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"Na prática\",\"title\":\"Veja o event loop em ação\",\"codeLabel\":\"garcom.js\",\"code\":\"console.log(\\\"1 — Pedido anotado\\\");\\n\\nsetTimeout(() =\u003e {\\n  console.log(\\\"3 — Prato entregue! 🍝\\\");\\n}, 0); // zero milissegundos!\\n\\nconsole.log(\\\"2 — Atendendo a próxima mesa\\\");\",\"tip\":\"Mesmo com 0ms, o callback do setTimeout vai para a 'cozinha' e depois para a fila. O garçom só entrega DEPOIS de terminar o que está fazendo.\"},{\"id\":6,\"type\":\"quiz\",\"tag\":\"Quiz\",\"title\":\"Preveja a saída\",\"question\":\"O que aparece no terminal ao rodar node garcom.js?\",\"options\":[{\"text\":\"1, 3, 2 — o timeout é de 0ms, então executa na hora\",\"correct\":false,\"explanation\":\"Pegadinha clássica! 0ms não significa 'agora': o callback vai para a fila e espera a pilha esvaziar.\"},{\"text\":\"1, 2, 3 — o callback só roda quando o código principal termina\",\"correct\":true,\"explanation\":\"Isso! O setTimeout delega para a 'cozinha', o código segue (imprime o 2), e só então o event loop entrega o 3.\"},{\"text\":\"3, 1, 2 — timeouts têm prioridade máxima\",\"correct\":false,\"explanation\":\"É o contrário: o código síncrono na pilha sempre roda primeiro. Callbacks esperam na fila.\"},{\"text\":\"1, 2 — o 3 nunca aparece\",\"correct\":false,\"explanation\":\"O 3 aparece sim — o event loop garante que todo callback da fila será executado quando a thread liberar.\"}],\"xp\":15},{\"id\":7,\"type\":\"concept\",\"tag\":\"Números\",\"title\":\"Por que esperar é imperdoável\",\"items\":[{\"icon\":\"⚡\",\"text\":\"Operação na CPU: ~1 nanossegundo. Ler da memória RAM: ~100 nanossegundos.\"},{\"icon\":\"💾\",\"text\":\"Ler do SSD: ~150 microssegundos — dezenas de milhares de vezes mais lento que a CPU.\"},{\"icon\":\"🌍\",\"text\":\"Requisição de rede: ~100 milissegundos — cerca de 100 MILHÕES de vezes mais lento que um ciclo de CPU.\"},{\"icon\":\"🤯\",\"text\":\"Se um ciclo de CPU fosse 1 segundo, uma requisição de rede levaria mais de 3 anos. Bloquear a thread esperando isso é jogar o servidor fora.\"}]},{\"id\":8,\"type\":\"code\",\"tag\":\"Dois mundos\",\"title\":\"Bloqueante vs não bloqueante\",\"codeLabel\":\"dois-mundos.js\",\"code\":\"import { readFileSync } from \\\"fs\\\";\\nimport { readFile } from \\\"fs/promises\\\";\\n\\n// ❌ SÍNCRONO — o garçom entra na cozinha e cozinha ele mesmo\\nconst dados = readFileSync(\\\"clientes.json\\\", \\\"utf-8\\\");\\n// TODO o restaurante para até o arquivo terminar de ser lido\\n\\n// ✅ ASSÍNCRONO — o garçom delega e continua atendendo\\nconst dados2 = await readFile(\\\"clientes.json\\\", \\\"utf-8\\\");\\n// a leitura acontece na \\\"cozinha\\\"; a thread segue livre\",\"tip\":\"Funções com Sync no nome bloqueiam o event loop. Em um servidor, elas são praticamente proibidas.\"},{\"id\":9,\"type\":\"concept\",\"tag\":\"async/await\",\"title\":\"Por que o código Node é cheio de await\",\"items\":[{\"icon\":\"🌀\",\"text\":\"No começo eram callbacks: função dentro de função dentro de função — o famigerado 'callback hell'.\"},{\"icon\":\"🤝\",\"text\":\"Promises organizaram a bagunça: um objeto que representa 'isso vai ficar pronto em breve'.\"},{\"icon\":\"✨\",\"text\":\"async/await é açúcar sintático sobre Promises: código assíncrono lido de cima para baixo, como código normal.\"},{\"icon\":\"📖\",\"text\":\"Traduzindo o await: 'garçom, me avise quando o prato sair — enquanto isso, atenda as outras mesas'.\"}],\"tip\":\"await pausa a FUNÇÃO, não a thread. O event loop continua girando e atendendo todo o resto.\"},{\"id\":10,\"type\":\"fill-blank\",\"tag\":\"Mão na massa\",\"title\":\"Complete o código\",\"instruction\":\"Qual palavra-chave pausa a função até a resposta chegar — sem travar o garçom? (digite só a palavra)\",\"prefix\":\"async function carregarAlunos() {\\n  const resposta = _____ fetch(\\\"/api/alunos\\\");\",\"suffix\":\"  return resposta.json();\\n}\",\"answer\":\"await\",\"hint\":\"É a palavra que só funciona dentro de funções async.\",\"xp\":20},{\"id\":11,\"type\":\"concept\",\"tag\":\"O limite\",\"title\":\"O calcanhar de aquiles: uma thread só\",\"items\":[{\"icon\":\"⚠️\",\"text\":\"O event loop resolve ESPERA (I/O). Ele não resolve TRABALHO pesado de CPU.\"},{\"icon\":\"🧮\",\"text\":\"Um cálculo que leva 10 segundos na thread = restaurante inteiro parado por 10 segundos.\"},{\"icon\":\"🐌\",\"text\":\"Redimensionar imagem, criptografar, rodar um loop gigante: tudo isso 'cozinha na mão do garçom'.\"},{\"icon\":\"🛟\",\"text\":\"Saídas: worker_threads, filas de processamento — ou outra linguagem para essa parte. Assunto da próxima aula.\"}]},{\"id\":12,\"type\":\"quiz\",\"tag\":\"Quiz final\",\"title\":\"Quem trava o garçom?\",\"question\":\"Qual destas tarefas TRAVA o event loop do Node?\",\"options\":[{\"text\":\"Ler um arquivo com await readFile de fs/promises\",\"correct\":false,\"explanation\":\"Assíncrono: a leitura vai para a libuv e a thread segue livre.\"},{\"text\":\"Esperar a resposta do banco de dados com await\",\"correct\":false,\"explanation\":\"Espera de rede é I/O — exatamente o que o event loop faz de melhor: delegar e seguir.\"},{\"text\":\"Um for que calcula números primos por 30 segundos\",\"correct\":true,\"explanation\":\"CPU-bound! Não há o que delegar: o cálculo ocupa a única thread e NADA mais é atendido nesses 30 segundos.\"},{\"text\":\"Receber 10 mil conexões simultâneas\",\"correct\":false,\"explanation\":\"Conexões são I/O — o cenário C10K é justamente onde o Node brilha.\"}],\"xp\":15},{\"id\":13,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão 02\",\"title\":\"LABORATÓRIO\\nDO LOOP\",\"subtitle\":\"Prove que o event loop existe — com os próprios olhos\",\"tasks\":[\"Crie garcom.js com o código do slide 5 e confirme a ordem 1, 2, 3\",\"Adicione um segundo setTimeout de 0ms e preveja a ordem ANTES de rodar\",\"Crie um arquivo grande: node -e \\\"console.log('x'.repeat(5000000))\\\" \u003e grande.txt\",\"Leia com readFileSync e com await readFile, medindo com console.time/timeEnd\",\"Trave o garçom: rode um while de ~3 segundos antes de um setTimeout e veja a entrega atrasar\"],\"bonus\":[\"Pesquise setImmediate e process.nextTick — quem fura a fila?\",\"Digite apenas node no terminal e explore o REPL interativo\"],\"xp\":50,\"nextHref\":\"/modulos/infra/node-3\",\"nextLabel\":\"Aula 03: Node no mundo real →\"}],\"backHref\":\"/modulos/infra\",\"backLabel\":\"Infraestrutura\",\"aulaLabel\":\"Aula 01 · P2 — Como o Node funciona\",\"aulaSlug\":\"infra-node-2\"}],[\"$L7\"],\"$L8\"]}],{},null,false,null]},null,false,\"$@9\"]},null,false,\"$@9\"]},null,false,\"$@9\"]},null,false,null],\"$La\",false]],\"m\":\"$undefined\",\"G\":[\"$b\",[\"$Lc\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"g-pGVvcGEV9O4jPvRGyfJ\"}\n"])</script><script>self.__next_f
