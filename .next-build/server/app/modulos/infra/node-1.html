:\"A ideia: pegar o V8 (o motor de JavaScript do Chrome) e levá-lo para fora do navegador, com I/O que nunca bloqueia.\"}]},{\"id\":3,\"type\":\"definition\",\"tag\":\"Definição\",\"title\":\"Node.js em uma frase\",\"quote\":\"Node.js é um runtime JavaScript construído sobre o motor V8 do Chrome, que executa JavaScript fora do navegador — com acesso a arquivos, rede e sistema operacional.\",\"highlights\":[\"runtime JavaScript\",\"motor V8\",\"fora do navegador\"],\"tip\":\"Guarde: Node.js NÃO é uma linguagem nem um framework. É o ambiente que executa a linguagem.\"},{\"id\":4,\"type\":\"concept\",\"tag\":\"Runtime?\",\"title\":\"O que é um runtime, afinal?\",\"items\":[{\"icon\":\"📖\",\"text\":\"A linguagem é só a gramática: as regras de sintaxe do JavaScript (o padrão ECMAScript).\"},{\"icon\":\"🚂\",\"text\":\"O runtime é quem executa: motor + APIs + ambiente para o código rodar de verdade.\"},{\"icon\":\"🌐\",\"text\":\"No browser, o runtime oferece DOM, window, alert() — ferramentas de página.\"},{\"icon\":\"🟢\",\"text\":\"No Node, o runtime oferece fs (arquivos), http (servidores), process — ferramentas de servidor.\"}],\"tip\":\"Mesmo JavaScript, caixas de ferramentas diferentes. Por isso document não existe no Node e fs não existe no browser.\"},{\"id\":5,\"type\":\"comparison\",\"tag\":\"Browser vs Node\",\"title\":\"O mesmo JS, dois mundos\",\"left\":{\"label\":\"JS no Browser\",\"items\":[\"Roda dentro de uma página\",\"DOM: document, window\",\"Não acessa arquivos do PC\",\"Preso na sandbox de segurança\",\"Cada aba é um mundo isolado\"]},\"right\":{\"label\":\"JS no Node.js\",\"items\":[\"Roda direto no sistema\",\"fs, http, path, process\",\"Lê e escreve arquivos\",\"Cria servidores e APIs\",\"Alimenta todo o tooling moderno\"]}},{\"id\":6,\"type\":\"diagram\",\"tag\":\"Arquitetura\",\"title\":\"A anatomia do runtime\",\"subtitle\":\"O caminho do seu código até o processador\",\"layers\":[{\"icon\":\"📜\",\"label\":\"SEU CÓDIGO JS\",\"desc\":\"app.js — o JavaScript que você escreve\",\"color\":\"fire\",\"connector\":\"é executado por\"},{\"icon\":\"⚙️\",\"label\":\"V8 ENGINE\",\"desc\":\"O motor do Chrome: compila JS para código de máquina em tempo real (JIT)\",\"color\":\"blue\",\"connector\":\"delega arquivos e rede para\"},{\"icon\":\"🔄\",\"label\":\"LIBUV\",\"desc\":\"Biblioteca em C que cuida do I/O assíncrono e do famoso event loop\",\"color\":\"green\",\"connector\":\"conversa com\"},{\"icon\":\"🖥️\",\"label\":\"SISTEMA OPERACIONAL\",\"desc\":\"Disco, rede, memória — onde as coisas acontecem de verdade\",\"color\":\"neutral\"}],\"tip\":\"O V8 executa seu código; a libuv faz o trabalho pesado de I/O. Essa dupla é o coração do Node — e o assunto da próxima aula.\"},{\"id\":7,\"type\":\"concept\",\"tag\":\"Ecossistema\",\"title\":\"npm: o superpoder do Node\",\"items\":[{\"icon\":\"📦\",\"text\":\"npm = Node Package Manager. Instala bibliotecas prontas com um único comando.\"},{\"icon\":\"🌍\",\"text\":\"É o maior registro de pacotes do mundo: mais de 2 milhões de pacotes públicos.\"},{\"icon\":\"⚡\",\"text\":\"React, Next.js, Tailwind, ESLint... tudo o que você usa neste curso chega via npm.\"},{\"icon\":\"🤝\",\"text\":\"npm install baixa o pacote e todas as dependências dele para a pasta node_modules.\"}]},{\"id\":13,\"type\":\"comparison\",\"tag\":\"Gerenciadores\",\"title\":\"npm, Yarn ou pnpm?\",\"left\":{\"label\":\"Alternativas\",\"items\":[\"Yarn (2016): nasceu para ser mais rápido que o npm da época\",\"pnpm: economiza disco com links simbólicos — 1 cópia de cada pacote\",\"Ambos usam o MESMO registro de pacotes do npm\",\"Comandos parecidos: yarn add / pnpm add\"]},\"right\":{\"label\":\"npm (nosso padrão)\",\"items\":[\"Já vem instalado com o Node\",\"Padrão do mercado e dos tutoriais\",\"npm moderno é rápido e confiável\",\"Um lockfile só: package-lock.json\"]},\"tip\":\"Escolha um e não misture: cada gerenciador tem seu lockfile, e misturar dois no mesmo projeto causa bugs difíceis. No curso, usamos npm.\"},{\"id\":8,\"type\":\"files\",\"tag\":\"Anatomia\",\"title\":\"package.json: a certidão do projeto\",\"codeLabel\":\"package.json\",\"code\":\"{\\n  \\\"name\\\": \\\"meu-projeto\\\",          ← identidade do projeto\\n  \\\"version\\\": \\\"1.0.0\\\",\\n  \\\"scripts\\\": {\\n    \\\"dev\\\": \\\"next dev\\\",            ← \\\"npm run dev\\\" executa isto\\n    \\\"build\\\": \\\"next build\\\",\\n    \\\"start\\\": \\\"next start\\\"\\n  },\\n  \\\"dependencies\\\": {\\n    \\\"next\\\": \\\"16.1.6\\\",             ← pacotes que vão para produção\\n    \\\"react\\\": \\\"19.2.1\\\"\\n  },\\n  \\\"devDependencies\\\": {\\n    \\\"typescript\\\": \\\"^5\\\",           ← usados só no desenvolvimento\\n    \\\"eslint\\\": \\\"^9\\\"\\n  }\\n}\",\"tip\":\"O package.json diz o que o projeto é, o que ele usa e quais comandos sabe executar. Todo projeto Node começa por ele.\"},{\"id\":9,\"type\":\"files\",\"tag\":\"Anatomia\",\"title\":\"node_modules e o arquivo de lock\",\"codeLabel\":\"estrutura do projeto\",\"code\":\"📁 meu-projeto/\\n  📄 package.json        ← o que você PEDIU (\\\"quero next 16\\\")\\n  📄 package-lock.json   ← o que foi INSTALADO (versões exatas)\\n  📁 node_modules/       ← os pacotes de verdade\\n    📁 next/\\n    📁 react/\\n    📁 ...               ← +300 pastas: dependências das dependências\\n  📄 .gitignore          ← node_modules NUNCA vai para o Git\",\"tip\":\"Apagou o node_modules? Sem pânico: npm install reconstrói tudo a partir do package-lock.json. Por isso ele fica fora do Git.\"},{\"id\":14,\"type\":\"code\",\"tag\":\"Sistema de arquivos\",\"title\":\"fs: JavaScript tocando o disco\",\"codeLabel\":\"arquivos.js\",\"code\":\"import { writeFile, readFile } from \\\"fs/promises\\\";\\n\\n// Escrever um arquivo — impossível no browser!\\nawait writeFile(\\\"diario.txt\\\", \\\"Dia 1: aprendi o que é um runtime 🔥\\\");\\n\\n// Ler o arquivo de volta\\nconst conteudo = await readFile(\\\"diario.txt\\\", \\\"utf-8\\\");\\nconsole.log(conteudo);\\n\\n// É assim que ferramentas reais funcionam:\\n// ESLint LÊ seus arquivos, Prettier os REESCREVE,\\n// e o Next.js LÊ src/app para montar suas rotas.\",\"tip\":\"O módulo fs é a prova de que saímos da sandbox do navegador: seu JavaScript agora lê e escreve no disco de verdade.\"},{\"id\":10,\"type\":\"quiz\",\"tag\":\"Quiz\",\"title\":\"Teste rápido\",\"question\":\"Um colega afirma: 'Node.js é uma linguagem de programação mais moderna que o JavaScript'. Ele está certo?\",\"options\":[{\"text\":\"Sim — Node.js substitui o JavaScript\",\"correct\":false,\"explanation\":\"Node.js não substitui nada: o código que roda dentro dele É JavaScript puro.\"},{\"text\":\"Não — Node.js é um runtime que executa JavaScript fora do navegador\",\"correct\":true,\"explanation\":\"Exato! Node.js é o ambiente de execução: V8 + libuv + APIs de sistema. A linguagem continua sendo JavaScript.\"},{\"text\":\"Em partes — Node.js é um framework, como o Next.js\",\"correct\":false,\"explanation\":\"Framework impõe estrutura e convenções (como o Next.js). O Node é uma camada abaixo: ele executa frameworks.\"},{\"text\":\"Não — Node.js é um banco de dados\",\"correct\":false,\"explanation\":\"Node não armazena dados. Ele executa JavaScript — inclusive o código que conversa com bancos de dados.\"}],\"xp\":15},{\"id\":11,\"type\":\"fill-blank\",\"tag\":\"Mão na massa\",\"title\":\"Complete o comando\",\"instruction\":\"Você criou o arquivo ola.js. Complete o comando do terminal que o executa com o Node (digite o comando completo):\",\"prefix\":\"// ola.js\\nconsole.log(\\\"Web On Fire! 🔥\\\");\\n\\n$ _______________\",\"answer\":\"node ola.js\",\"hint\":\"É o nome do runtime seguido do nome do arquivo.\",\"xp\":20},{\"id\":12,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão 01\",\"title\":\"PRIMEIRO CONTATO\",\"subtitle\":\"Rode JavaScript fora do navegador pela primeira vez\",\"tasks\":[\"Verifique a instalação: node -v e npm -v no terminal\",\"Crie um arquivo ola.js com um console.log c
