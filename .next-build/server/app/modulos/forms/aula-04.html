o menos descritivas\",\"Manutenção mais lenta (menos ativo)\",\"Ainda muito usado em código legado\"]},\"right\":{\"label\":\"Zod (recomendado)\",\"items\":[\"TypeScript-first: inferência automática\",\"API fluente e intuitiva (.string().email())\",\"Erros descritivos e localizáveis\",\"Ativo, crescente, usado pelo tRPC/Next.js\",\"Um schema serve para frontend e backend\"]},\"tip\":\"Yup ainda funciona — mas se você está começando hoje, vá de Zod. O ecossistema Next.js convergiu para ele.\"},{\"id\":4,\"type\":\"code\",\"tag\":\"Instalação\",\"title\":\"Dependências (já instaladas no setup)\",\"codeLabel\":\"terminal  +  verificação\",\"code\":\"# Se ainda não instalou na aula 01:\\nnpm install react-hook-form zod @hookform/resolvers\\n\\n# react-hook-form → gerencia o estado do formulário\\n# zod             → define e valida o schema dos dados\\n# @hookform/resolvers → conecta o Zod ao react-hook-form\\n\\n# Verifique o package.json:\\n# \\\"react-hook-form\\\": \\\"^7.x\\\",\\n# \\\"zod\\\": \\\"^3.x\\\",\\n# \\\"@hookform/resolvers\\\": \\\"^3.x\\\"\",\"tip\":\"@hookform/resolvers é o elo que permite usar qualquer schema de validação (Zod, Yup, Joi...) com o react-hook-form.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"Schema Zod\",\"title\":\"Definindo o schema do formulário\",\"codeLabel\":\"src/schemas/student.schema.ts\",\"code\":\"import { z } from \\\"zod\\\";\\n\\nexport const studentSchema = z.object({\\n  nome: z\\n    .string()\\n    .min(3, \\\"Nome deve ter ao menos 3 caracteres\\\")\\n    .max(100, \\\"Nome muito longo\\\"),\\n\\n  email: z\\n    .string()\\n    .email(\\\"Informe um email válido\\\"),\\n\\n  cpf: z\\n    .string()\\n    .regex(/^d{3}.d{3}.d{3}-d{2}$/, \\\"CPF inválido (formato: 000.000.000-00)\\\"),\\n\\n  telefone: z\\n    .string()\\n    .regex(/^(d{2}) d{4,5}-d{4}$/, \\\"Telefone inválido\\\"),\\n\\n  turma: z\\n    .string()\\n    .min(1, \\\"Selecione a turma\\\")\\n    .optional(),\\n});\\n\\n// TypeScript infere o tipo automaticamente a partir do schema 🎉\\nexport type StudentFormData = z.infer\u003ctypeof studentSchema\u003e;\",\"tip\":\"z.infer\u003ctypeof schema\u003e gera o tipo TypeScript automaticamente — você não precisa definir a interface duas vezes.\"},{\"id\":6,\"type\":\"code\",\"tag\":\"useForm + zodResolver\",\"title\":\"Conectando o schema ao formulário\",\"codeLabel\":\"src/app/alunos/cadastro/page.tsx\",\"code\":\"\\\"use client\\\";\\n\\nimport { useForm } from \\\"react-hook-form\\\";\\nimport { zodResolver } from \\\"@hookform/resolvers/zod\\\";\\nimport { studentSchema, type StudentFormData } from \\\"@/schemas/student.schema\\\";\\n\\nexport default function CadastroPage() {\\n  const {\\n    register,          // vincula input ao formulário\\n    handleSubmit,      // envolve o onSubmit com validação automática\\n    formState: { errors, isSubmitting },\\n  } = useForm\u003cStudentFormData\u003e({\\n    resolver: zodResolver(studentSchema), // conecta o Zod\\n    defaultValues: { nome: \\\"\\\", email: \\\"\\\", cpf: \\\"\\\", telefone: \\\"\\\" },\\n  });\\n\\n  async function onSubmit(data: StudentFormData) {\\n    // data já está validado e tipado pelo Zod\\n    console.log(\\\"Dados válidos:\\\", data);\\n    // aqui viria: await fetch('/api/alunos', { method: 'POST', body: JSON.stringify(data) })\\n  }\\n\\n  return (\\n    \u003cform onSubmit={handleSubmit(onSubmit)}\u003e\\n      {/* inputs com register — próximo slide */}\\n    \u003c/form\u003e\\n  );\\n}\",\"tip\":\"handleSubmit só chama onSubmit se todos os campos passarem na validação do Zod — nenhum dado inválido escapa.\"},{\"id\":7,\"type\":\"code\",\"tag\":\"Formulário completo\",\"title\":\"Inputs com registro e mensagens de erro\",\"codeLabel\":\"src/app/alunos/cadastro/page.tsx (continuação)\",\"code\":\"$7\",\"tip\":\"O spread {...register('campo')} injeta os handlers onChange, onBlur e a ref — tudo que o react-hook-form precisa para rastrear o campo.\"},{\"id\":8,\"type\":\"code\",\"tag\":\"Mensagens PT-BR\",\"title\":\"Personalizando e reutilizando mensagens\",\"codeLabel\":\"src/schemas/student.schema.ts (refinado)\",\"code\":\"import { z } from \\\"zod\\\";\\n\\n// Mensagens centralizadas — mudança em um lugar reflete em todo o app\\nconst MSG = {\\n  required: \\\"Campo obrigatório\\\",\\n  email: \\\"Informe um email válido (ex: nome@dominio.com)\\\",\\n  cpfFormat: \\\"CPF deve estar no formato 000.000.000-00\\\",\\n  telefoneFormat: \\\"Telefone deve estar no formato (00) 00000-0000\\\",\\n} as const;\\n\\nexport const studentSchema = z.object({\\n  nome: z\\n    .string({ required_error: MSG.required })\\n    .min(3, \\\"Nome deve ter ao menos 3 letras\\\")\\n    .max(100),\\n\\n  email: z\\n    .string({ required_error: MSG.required })\\n    .email(MSG.email),\\n\\n  cpf: z\\n    .string({ required_error: MSG.required })\\n    .regex(/^d{3}.d{3}.d{3}-d{2}$/, MSG.cpfFormat),\\n\\n  telefone: z\\n    .string({ required_error: MSG.required })\\n    .regex(/^(d{2}) d{4,5}-d{4}$/, MSG.telefoneFormat),\\n});\\n\\nexport type StudentFormData = z.infer\u003ctypeof studentSchema\u003e;\",\"tip\":\"Centralizar as mensagens facilita tradução, auditoria e mudanças de tom (formal vs. informal) — sem caçar strings pelo código.\"},{\"id\":9,\"type\":\"quiz\",\"tag\":\"Quiz\",\"title\":\"O que z.string().email() faz com dados inválidos?\",\"question\":\"Você chama studentSchema.parse({ email: 'joao' }). O que o Zod retorna?\",\"options\":[{\"text\":\"Retorna o objeto { email: 'joao' } sem nenhum erro\",\"correct\":false,\"explanation\":\"'joao' não é um email válido — o Zod lança uma ZodError com a mensagem configurada.\"},{\"text\":\"Lança uma ZodError com a mensagem de email inválido\",\"correct\":true,\"explanation\":\"Correto! .parse() lança exceção se os dados forem inválidos. Use .safeParse() se quiser tratar o erro sem try/catch.\"},{\"text\":\"Retorna null silenciosamente\",\"correct\":false,\"explanation\":\"O Zod nunca retorna null silenciosamente em .parse() — erro = exceção. Para comportamento silencioso, use .safeParse().\"},{\"text\":\"Corrige o email automaticamente para o formato correto\",\"correct\":false,\"explanation\":\"O Zod valida, não corrige. Para transformações, use .transform() ou .preprocess() explicitamente.\"}],\"xp\":15},{\"id\":10,\"type\":\"fill-blank\",\"tag\":\"Mão na massa\",\"title\":\"Complete o zodResolver\",\"instruction\":\"Complete a linha que conecta o schema Zod ao react-hook-form:\",\"prefix\":\"import { useForm } from \\\"react-hook-form\\\";\\nimport { _______ } from \\\"@hookform/resolvers/zod\\\";\\nimport { studentSchema } from \\\"@/schemas/student.schema\\\";\\n\\nconst { register, handleSubmit, formState: { errors } } = useForm({\\n  resolver: _______(studentSchema),\\n});\",\"answer\":\"zodResolver\",\"hint\":\"A função importada e usada tem o mesmo nome: zodResolver.\",\"xp\":20},{\"id\":11,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão F4\",\"title\":\"FORMULÁRIO\\nSEM BURACOS\",\"subtitle\":\"Nenhum dado inválido passa pelo FormFire\",\"tasks\":[\"Crie src/schemas/student.schema.ts com z.object() para nome, email, cpf e telefone\",\"Use z.infer\u003ctypeof studentSchema\u003e para gerar o tipo StudentFormData automaticamente\",\"Instale/confirme @hookform/resolvers e importe zodResolver\",\"Conecte o schema ao formulário com resolver: zodResolver(studentSchema)\",\"Exiba errors.campo.message embaixo de cada input quando houver erro\",\"Teste: tente submeter o formulário vazio e confirme que as mensagens aparecem\"],\"bonus\":[\"Use z.string().min(1, 'Campo obrigatório') em vez de optional() para tornar todos os campos obrigatórios\",\"Adicione mode: 'onChange' no useForm para validar ao digitar (em vez de esperar o submit)\"],\"xp\":50,\"nextHref\":\"/modulos/forms/aula-05\",\"nextLabel\":\"Aula 05: Máscaras de Input →\"}],\"backHref\":\"/modulos/forms\",\"backLabel\":\"Formulários \u0026 UX\",\"aulaLabel\":\"Aula 04 — Validação com Zod\",\"aulaSlug\":\"forms-aula-04\
