\"right\":{\"label\":\"react-imask (recomendado)\",\"items\":[\"Baseado no IMask.js — maduro e ativo\",\"Suporta máscaras estáticas, dinâmicas e regex\",\"Integra facilmente com react-hook-form\",\"Typescript-friendly com tipagem completa\",\"Funciona com qualquer padrão: CPF, CNPJ, CEP...\"]},\"tip\":\"react-number-format é excelente para campos de valor monetário (R$ 1.234,56). Para campos de identidade (CPF, telefone), react-imask é mais flexível.\"},{\"id\":4,\"type\":\"code\",\"tag\":\"Instalação\",\"title\":\"Instalando e importando o react-imask\",\"codeLabel\":\"terminal  +  uso básico\",\"code\":\"# Já instalado no setup da aula 01 (react-imask)\\n# Confirme no package.json: \\\"react-imask\\\": \\\"^7.x\\\"\\n\\n# Se precisar instalar agora:\\nnpm install react-imask\\n\\n# -----------------------------------------\\n# Uso básico — sem react-hook-form ainda\\nimport { IMaskInput } from \\\"react-imask\\\";\\n\\n\u003cIMaskInput\\n  mask=\\\"000.000.000-00\\\"   // zeros são dígitos\\n  placeholder=\\\"000.000.000-00\\\"\\n  onAccept={(value) =\u003e console.log(\\\"Valor aceito:\\\", value)}\\n/\u003e\\n\\n// onAccept é chamado sempre que a máscara aceita um novo valor\\n// value é a string formatada: \\\"123.456.789-00\\\"\",\"tip\":\"Na convenção do IMask: '0' aceita um dígito (0-9), 'a' aceita uma letra, '*' aceita qualquer caractere.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"CPF\",\"title\":\"Máscara de CPF no formulário\",\"codeLabel\":\"src/app/alunos/cadastro/page.tsx (CPF)\",\"code\":\"\\\"use client\\\";\\n\\nimport { IMaskInput } from \\\"react-imask\\\";\\nimport { useForm } from \\\"react-hook-form\\\";\\nimport { zodResolver } from \\\"@hookform/resolvers/zod\\\";\\nimport { studentSchema, type StudentFormData } from \\\"@/schemas/student.schema\\\";\\n\\nexport default function CadastroPage() {\\n  const { setValue, handleSubmit, formState: { errors } } = useForm\u003cStudentFormData\u003e({\\n    resolver: zodResolver(studentSchema),\\n  });\\n\\n  return (\\n    \u003cform onSubmit={handleSubmit((data) =\u003e console.log(data))}\u003e\\n\\n      {/* Campo CPF com máscara */}\\n      \u003cdiv\u003e\\n        \u003clabel\u003eCPF\u003c/label\u003e\\n        \u003cIMaskInput\\n          mask=\\\"000.000.000-00\\\"\\n          placeholder=\\\"000.000.000-00\\\"\\n          onAccept={(value: string) =\u003e {\\n            // atualiza o react-hook-form manualmente\\n            setValue(\\\"cpf\\\", value, { shouldValidate: true });\\n          }}\\n        /\u003e\\n        {errors.cpf \u0026\u0026 (\\n          \u003cspan style={{ color: \\\"red\\\", fontSize: \\\"0.8rem\\\" }}\u003e\\n            {errors.cpf.message}\\n          \u003c/span\u003e\\n        )}\\n      \u003c/div\u003e\\n\\n    \u003c/form\u003e\\n  );\\n}\",\"tip\":\"shouldValidate: true faz o Zod revalidar o campo assim que o usuário aceita um valor — feedback imediato.\"},{\"id\":6,\"type\":\"code\",\"tag\":\"Telefone + CEP\",\"title\":\"Máscaras dinâmica de telefone e CEP\",\"codeLabel\":\"src/app/alunos/cadastro/page.tsx (telefone + CEP)\",\"code\":\"{/* Telefone: aceita 8 ou 9 dígitos após o DDD */}\\n\u003cIMaskInput\\n  mask={[\\n    { mask: \\\"(00) 0000-0000\\\" },   // telefone fixo: 8 dígitos\\n    { mask: \\\"(00) 00000-0000\\\" },  // celular: 9 dígitos\\n  ]}\\n  placeholder=\\\"(11) 91234-5678\\\"\\n  onAccept={(value: string) =\u003e setValue(\\\"telefone\\\", value, { shouldValidate: true })}\\n/\u003e\\n{errors.telefone \u0026\u0026 \u003cspan style={{ color: \\\"red\\\" }}\u003e{errors.telefone.message}\u003c/span\u003e}\\n\\n{/* CEP — se quiser adicionar ao schema */}\\n\u003cIMaskInput\\n  mask=\\\"00000-000\\\"\\n  placeholder=\\\"00000-000\\\"\\n  onAccept={(value: string) =\u003e setValue(\\\"cep\\\", value, { shouldValidate: true })}\\n/\u003e\\n\\n{/* Observação sobre o schema Zod do CEP: */}\\n{/* cep: z.string().regex(/^d{5}-d{3}$/, \\\"CEP inválido\\\") */}\",\"tip\":\"Máscaras em array (modo dinâmico) fazem
