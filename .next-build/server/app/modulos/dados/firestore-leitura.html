uivos.\"},{\"icon\":\"⚡\",\"text\":\"Vantagens: flexível, escala sozinho, sincroniza em tempo real. Trade-off: você modela pensando em COMO vai LER.\"}]},{\"id\":3,\"type\":\"diagram\",\"tag\":\"Estrutura\",\"title\":\"A hierarquia do Firestore\",\"subtitle\":\"Coleção contém documentos, que contêm campos (e subcoleções)\",\"layers\":[{\"icon\":\"🗂️\",\"label\":\"COLEÇÃO — \\\"alunos\\\"\",\"desc\":\"Um agrupamento de documentos do mesmo tipo\",\"color\":\"fire\",\"connector\":\"contém vários\"},{\"icon\":\"📄\",\"label\":\"DOCUMENTO — id \\\"abc123\\\"\",\"desc\":\"Um registro identificado por um ID único\",\"color\":\"amber\",\"connector\":\"guarda\"},{\"icon\":\"🔤\",\"label\":\"CAMPOS\",\"desc\":\"{ nome: \\\"Ana\\\", xp: 350, badges: [...] } — os dados em si\",\"color\":\"green\"}],\"loopBack\":\"um documento pode ter subcoleções — árvore aninhada\",\"tip\":\"Caminho de um documento: alunos/abc123. De um campo dentro dele: alunos/abc123 → xp. Simples e previsível.\"},{\"id\":4,\"type\":\"concept\",\"tag\":\"Modelagem\",\"title\":\"A regra de ouro do NoSQL\",\"items\":[{\"icon\":\"👀\",\"text\":\"Modele pensando em COMO você vai LER os dados, não em como armazená-los 'corretamente'.\"},{\"icon\":\"📑\",\"text\":\"Tela mostra lista de alunos com XP? Então cada aluno é um documento com o XP dentro — leitura de 1 coleção.\"},{\"icon\":\"🔁\",\"text\":\"Duplicar dado é OK no NoSQL (desnormalização): melhor guardar o nome do autor no post do que fazer JOIN.\"},{\"icon\":\"🎯\",\"text\":\"Neste curso: coleções alunos, progresso, atividade — cada uma pensada para uma tela específica do professor/aluno.\"}]},{\"id\":5,\"type\":\"code\",\"tag\":\"Leitura\",\"title\":\"Lendo um documento e uma coleção\",\"codeLabel\":\"services/alunoService.ts\",\"code\":\"import { doc, getDoc, collection, getDocs } from \\\"firebase/firestore\\\";\\nimport { db } from \\\"@/lib/firebaseConfig\\\";\\n\\n// Ler UM documento pelo id\\nexport async function getAluno(id: string) {\\n  const snap =
