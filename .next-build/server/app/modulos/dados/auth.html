"Neste módulo: Firebase Auth (identidade) + Firestore (dados) + Server Actions (mutações seguras).\"}]},{\"id\":3,\"type\":\"concept\",\"tag\":\"Autenticação\",\"title\":\"Autenticação vs Autorização\",\"items\":[{\"icon\":\"🪪\",\"text\":\"Autenticação: QUEM é você? Provar identidade — login com e-mail/senha, Google, GitHub.\"},{\"icon\":\"🚪\",\"text\":\"Autorização: o que você PODE fazer? Um aluno vê o próprio progresso; só o professor vê o de todos.\"},{\"icon\":\"🎫\",\"text\":\"O Firebase Auth resolve a autenticação e entrega um 'crachá' (token) que prova a identidade em cada requisição.\"},{\"icon\":\"🛡️\",\"text\":\"A autorização é sua regra de negócio: baseada no token, você decide o que liberar (rotas, dados, ações).\"}]},{\"id\":4,\"type\":\"code\",\"tag\":\"Setup\",\"title\":\"Configurando o Firebase Auth\",\"codeLabel\":\"lib/firebaseConfig.ts\",\"code\":\"import { initializeApp, getApps, getApp } from \\\"firebase/app\\\";\\nimport { getAuth } from \\\"firebase/auth\\\";\\nimport { getFirestore } from \\\"firebase/firestore\\\";\\n\\nconst firebaseConfig = {\\n  apiKey: process.env.NEXT_PUBLIC_FIREBASE_API_KEY,\\n  authDomain: process.env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,\\n  projectId: process.env.NEXT_PUBLIC_FIREBASE_PROJECT_ID,\\n  // ...restante do config\\n};\\n\\n// Evita reinicializar o app no hot-reload do Next\\nconst app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();\\n\\nexport const auth = getAuth(app);\\nexport const db = getFirestore(app);\",\"tip\":\"As chaves NEXT_PUBLIC_ do Firebase são públicas por design (o app roda no browser). A segurança real vem das Security Rules do Firestore, não do sigilo da chave.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"Login\",\"title\":\"Os métodos de autenticação\",\"codeLabel\":\"auth.ts\",\"code\":\"import {\\n  createUserWithEmailAndPassword,\\n  signInWithEmailAndPassword,\\n  signInWithPopup,\\n  GoogleAuthProvider,\\n  signOut,\\n} from \\\"firebase/auth\\\";\\nimport { auth } from \\\"@/lib/firebaseConfig\\\";\\n\\n// Cadastro com e-mail e senha\\nawait createUserWithEmailAndPassword(auth, email, senha);\\n\\n// Login com e-mail e senha\\nawait signInWithEmailAndPassword(auth, email, senha);\\n\\n// Login social (um popup, zero formulário)\\nconst google = new GoogleAuthProvider();\\nawait signInWithPopup(auth, google);\\n\\n// Sair\\nawait signOut(auth);\",\"tip\":\"É exatamente esse código que roda por trás do /login deste curso. O Firebase gerencia sessão, tokens e persistência automaticamente.\"},{\"id\":6,\"type\":\"code\",\"tag\":\"Estado do usuário\",\"title\":\"Observando quem está logado\",\"codeLabel\":\"AuthContext.tsx\",\"code\":\"\\\"use client\\\";\\nimport { onAuthStateChanged, type User } from \\\"firebase/auth\\\";\\nimport { auth } from \\\"@/lib/firebaseConfig\\\";\\n\\n// onAuthStateChanged dispara a cada login/logout — em tempo real\\nuseEffect(() =\u003e {\\n  const unsub = onAuthStateChanged(auth, (user) =\u003e {\\n    setUser(user);        // User | null\\n    setLoading(false);\\n  });\\n  return unsub;           // limpa o listener ao desmontar\\n}, []);\\n\\n// Compartilhe via Context para o app todo saber quem é o usuário:\\n// const { user, loading } = useAuth();\",\"tip\":\"onAuthStateChanged é a fonte da verdade: um só listener no topo do app, e todo componente descobre o usuário logado via Context.\"},{\"id\":7,\"type\":\"quiz\",\"tag\":\"Quiz\",\"title\":\"Auth na cabeça\",\"question\":\"Um Client Component precisa saber, em tempo real, se o usuário fez login ou logout. Qual a ferramenta certa?\",\"options\":[{\"text\":\"Um fetch para /api/user a cada 5 segundos\",\"correct\":false,\"explanation\":\"Polling é desperdício e atrasado. O Firebase te avisa na hora, sem ficar perguntando.\"},{\"text\":\"onAuthStateChanged — um listener que dispara a cada mudança\",\"correct\":true,\"explanation\":\"Exato! É reativo: login ou logout dispara o callback imediatamente. Um listener no topo alimenta o app inteiro.\"},{\"text\":\"Ler o localStorage manualmente no render\",\"correct\":false,\"explanation\":\"O Firebase já persiste a sessão. Mexer no localStorage na mão ignora o mecanismo oficial e quebra fácil.\"},{\"text\":\"Guardar o usuário numa variável global comum\",\"correct\":false,\"explanation\":\"Variável global não é reativa — a UI não re-renderiza quando ela muda. Precisa de estado + listener.\"}],\"xp\":15},{\"id\":8,\"type\":\"concept\",\"tag\":\"Proteção de rotas\",\"title\":\"Duas camadas de proteção\",\"items\":[{\"icon\":\"🖥️\",\"text\":\"No cliente: se !user, redirecione para /login (o que a página /progresso deste curso faz). Bom para UX.\"},{\"icon\":\"🛡️\",\"text\":\"No Middleware: intercepta a requisição ANTES da página renderizar — proteção que roda no servidor (Edge).\"},{\"icon\":\"🍪\",\"text\":\"O middleware lê um cookie de sessão para decidir: deixa passar ou redireciona. Roda em toda navegação.\"},{\"icon\":\"⚖️\",\"text\":\"Regra: cliente para UX (redirect suave), servidor/rules para SEGURANÇA real. As duas juntas.\"}]},{\"id\":9,\"type\":\"code\",\"tag\":\"Middleware\",\"title\":\"Protegendo rotas no Edge\",\"codeLabel\":\"src/middleware.ts\",\"code\":\"import { NextRequest, NextResponse } from \\\"next/server\\\";\\n\\nexport function middleware(req: NextRequest) {\\n  const sessao = req.cookies.get(\\\"__session\\\")?.value;\\n  const querEntrar = req.nextUrl.pathname.startsWith(\\\"/admin\\\");\\n\\n  // sem sessão tentando acessar área protegida? bloqueia\\n  if (querEntrar \u0026\u0026 !sessao) {\\n    return NextResponse.redirect(new URL(\\\"/login\\\", req.url));\\n  }\\n  return NextResponse.next();\\n}\\n\\n// Define QUAIS rotas o middleware intercepta\\nexport const config = {\\n  matcher: [\\\"/admin/:path*\\\", \\\"/progresso/:path*\\\"],\\n};\",\"tip\":\"O matcher é a lista de portas que o segurança vigia. Rotas fora dela nem passam pelo middleware — performance preservada.\"},{\"id\":10,\"type\":\"fill-blank\",\"tag\":\"Mão na massa\",
