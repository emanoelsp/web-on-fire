           ← chaves do Firebase (NUNCA suba no git!)\",\"tip\":\"O grupo (auth) usa parênteses no nome da pasta: organiza sem adicionar /auth na URL. O link correto é /login, não /auth/login.\"},{\"id\":4,\"type\":\"architecture\",\"tag\":\"Passo a passo\",\"title\":\"Monte o projeto em 6 passos\",\"subtitle\":\"Faça um de cada vez antes de copiar o código\",\"steps\":[{\"icon\":\"1️⃣\",\"text\":\"Crie o projeto: npx create-next-app@latest meu-app — TypeScript: sim, App Router: sim, Tailwind CSS: sim.\"},{\"icon\":\"2️⃣\",\"text\":\"Instale o Firebase: npm install firebase (dentro da pasta meu-app).\"},{\"icon\":\"3️⃣\",\"text\":\"Crie as pastas: firebase/, services/, app/(auth)/login/, app/(auth)/cadastro/, app/aplicacao/.\"},{\"icon\":\"4️⃣\",\"text\":\"Crie o arquivo .env.local na raiz com as variáveis NEXT_PUBLIC_FIREBASE_* — próximo slide mostra o formato.\"},{\"icon\":\"5️⃣\",\"text\":\"Copie cada arquivo dos slides seguintes na ordem em que aparecem (config.ts primeiro).\"},{\"icon\":\"6️⃣\",\"text\":\"Rode npm run dev e acesse http://localhost:3000 — cadastre-se, faça login, acesse /aplicacao e saia.\"}],\"tip\":\"Sempre copie o firebase/config.ts antes dos outros arquivos: todos dependem do auth exportado por ele.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"Antes de começar\",\"title\":\".env.local — Chaves do Firebase\",\"codeLabel\":\".env.local\",\"code\":\"# Cole os valores do Firebase Console →\\n# Configurações do projeto → Seus apps → Configuração do SDK\\n\\nNEXT_PUBLIC_FIREBASE_API_KEY=AIzaSy...\\nNEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=meu-app.firebaseapp.com\\nNEXT_PUBLIC_FIREBASE_PROJECT_ID=meu-app\\nNEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=meu-app.appspot.com\\nNEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=123456789\\nNEXT_PUBLIC_FIREBASE_APP_ID=1:123456789:web:abc...\",\"tip\":\"NEXT_PUBLIC_ é obrigatório para o browser enxergar as variáveis. Adicione .env.local no .gitignore — o arquivo já deve estar lá se você usou create-next-app.\"},{\"id\":6,\"type\":\"code\",\"tag\":\"Arquivo 1 de 6\",\"title\":\"firebase/config.ts\",\"codeLabel\":\"firebase/config.ts\",\"code\":\"import { initializeApp, getApps, getApp } from \\\"firebase/app\\\";\\nimport { getAuth } from \\\"firebase/auth\\\";\\n\\nconst firebaseConfig = {\\n  apiKey:            process.env.NEXT_PUBLIC_FIREBASE_API_KEY,\\n  authDomain:        process.env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,\\n  projectId:         process.env.NEXT_PUBLIC_FIREBASE_PROJECT_ID,\\n  storageBucket:     process.env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,\\n  messagingSenderId: process.env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,\\n  appId:             process.env.NEXT_PUBLIC_FIREBASE_APP_ID,\\n};\\n\\n// getApps() evita reinicializar no hot-reload do Next.js\\nconst app = getApps().length === 0\\n  ? initializeApp(firebaseConfig)\\n  : getApp();\\n\\nexport const auth = getAuth(app);\",\"tip\":\"Um único arquivo de configuração. Todos os outros serviços (Firestore, Storage) também seriam inicializados e exportados aqui.\"},{\"id\":7,\"type\":\"code\",\"tag\":\"Arquivo 2 de 6 — Parte 1\",\"title\":\"services/autenticar.ts — Login e Cadastro\",\"codeLabel\":\"services/autenticar.ts\",\"code\":\"import {\\n  createUserWithEmailAndPassword,\\n  signInWithEmailAndPassword,\\n  updateProfile,\\n  signOut,\\n} from \\\"firebase/auth\\\";\\nimport { auth } from \\\"@/firebase/config\\\";\\n\\nexport async function cadastrar(nome: string, email: string, senha: string) {\\n  const cred = await createUserWithEmailAndPassword(auth, email, senha);\\n  await updateProfile(cred.user, { displayName: nome });\\n  return cred.user;\\n}\\n\\nexport async function entrar(email: string, senha: string) {\\n  const cred = await signInWithEmailAndPassword(auth, email, senha);\\n  return cred.user;\\n}\\n\\nexport async function sair() {\\n  await signOut(auth);\\n}\",\"tip\":\"updateProfile salva o nome logo após o cadastro — o usuário já aparece com displayName preenchido na mesma sessão.\"},{\"id\":8,\"type\":\"code\",\"tag\":\"Arquivo 2 de 6 — Parte 2\",\"title\":\"services/autenticar.ts — Editar e Excluir\",\"codeLabel\":\"services/autenticar.ts (continuação — cole abaixo das funções anteriores)\",\"code\":\"import {\\n  updateProfile,\\n  updatePassword,\\n  deleteUser,\\n  EmailAuthProvider,\\n  reauthenticateWithCredential,\\n} from \\\"firebase/auth\\\";\\nimport { auth } from \\\"@/firebase/config\\\";\\n\\nexport async function editarPerfil(novoNome: string) {\\n  if (!auth.currentUser) throw new Error(\\\"Não autenticado\\\");\\n  await updateProfile(auth.currentUser, { displayName: novoNome });\\n}\\n\\nexport async function excluirConta(senhaAtual: string) {\\n  const user = auth.currentUser;\\n  if (!user?.email) throw new Error(\\\"Não autenticado\\\");\\n  const cred = EmailAuthProvider.credential(user.email, senhaAtual);\\n  await reauthenticateWithCredential(user, cred);\\n  await deleteUser(user);\\n}\\n\\nexport async function alterarSenha(senhaAtual: string, novaSenha: string) {\\n  const user = auth.currentUser;\\n  if (!user?.email) throw new Error(\\\"Não autenticado\\\");\\n  const cred = EmailAuthProvider.credential(user.email, senhaAtual);\\n  await reauthenticateWithCredential(user, cred);\\n  await updatePassword(user, novaSenha);\\n}\",\"tip\":\"Operações sensíveis (excluir conta, trocar senha) exigem reautenticação recente — o Firebase rejeita se o login foi há muito tempo, por segurança.\"},{\"id\":9,\"type\":\"code\",\"tag\":\"Arquivo 3 de 6\",\"title\":\"app/page.tsx — Página Inicial\",\"codeLabel\":\"app/page.tsx\",\"code\":\"$7\",\"tip\":\"Os links são /login e /cadastro — sem /auth/ no caminho! O grupo (auth) organiza os arquivos, mas não aparece na URL.\"},{\"id\":10,\"type\":\"code\",\"tag\":\"Arquivo 4 de 6\",\"title\":\"(auth)/login/page.tsx — Formulário de Login\",\"codeLabel\":\"app/(auth)/login/page.tsx\",\"code\":\"$8\",\"tip\":\"O try/catch captura todos os erros do Firebase e exibe uma mensagem amigável. O link para cadastro usa /cadastro — não /auth/cadastro.\"},{\"id\":11,\"type\":\"code\",\"tag\":\"Arquivo 5 de 6\",\"title\":\"(auth)/cadastro/page.tsx — Criar Conta\",\"codeLabel\":\"app/(auth)/cadastro/page.tsx\",\"code\":\"$9\",\"tip\":\"minLength={6} dá feedback imediato antes de chamar o Firebase. O link para login usa /login — não /auth/login.\"},{\"id\":12,\"type\":\"code\",\"tag\":\"Arquivo 6 de 6\",\"title\":\"aplicacao/page.tsx — Rota Protegida\",\"codeLabel\":\"app/aplicacao/page.tsx\",\"code\":\"$a\",\"tip\":\"carregando=true evita o flash de conteúdo privado. O redirect usa /login — não /auth/login.\"},{\"id\":13,\"type\":\"concept\",\"tag\":\"Entendendo o código\",\"title\":\"Como as peças se conectam\",\"items\":[{\"icon\":\"🔗\",\"text\":\"firebase/config.ts é o ponto único de inicialização — todos importam auth de lá, garantindo uma única instância no app inteiro.\"},{\"icon\":\"🧩\",\"text\":\"services/autenticar.ts encapsula o Firebase: as páginas chamam cadastrar(), entrar() e sair() sem saber nada sobre o SDK diretamente.\"},{\"icon\":\"👁️\",\"text\":\"onAuthStateChanged é o sensor: dispara imediatamente ao montar e toda vez que o estado muda (login, logout, expiração de sessão).\"},{\"icon\":\"🚦\",\"text\":\"A proteção é reativa: se a sessão expirar enquanto o usuário está em /aplicacao, o redirect para /login acontece automaticamente.\"},{\"icon\":\"📁\",\"text\":\"O grupo (auth) é só organização de arquivos — as URLs são /login e /cadastro, nunca /auth/login ou /auth/cadastro.\"}]},{\"id\":14,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão Projeto Base\",\"title\":\"PROJETO BASE\\nNO AR\",\"subtitle\":\"Clone a estrutura e veja o app funcionando\",\"tasks\":[\"Crie um projeto Next.js com TypeScript, App Router e Tailwind CSS (create-next-app)\",\"Instale o Firebase: npm install firebase\",\"Crie as pastas: firebase/, services/, app/(auth)/login/, app/(auth)/cadastro/, app/aplicacao/\",\"Configure o .env.local com as chaves do seu projeto Firebase Console\",\"Copie cada arquivo dos slides anteriores (firebase/config.ts primeiro)\",\"Rode npm run dev: cadastre-se em /cadastro, faça login em /login, acesse /aplicacao e saia\"],\"bonus\":[\"Adicione tratamento de erro específico por código Firebase (auth/email-already-in-use, auth/weak-password)\",\"Exiba o nome e foto do usuário no header usando onAuthStateChanged em um Context global\"],\"xp\":40,\"nextHref\":\"/modulos/dados/firestore-leitura\",\"nextLabel\":\"Aula 02: Firestore (Leitura) →\"}],\"backHref\":\"/modulos/dados\",\"backLabel\":\"Persistência \u0026 BaaS\",\"aulaLabel\":\"Projeto Base — Firebase Auth Completo\",\"aulaSlug\":\"dados-projeto-base\"}],[\"$Lb\"],\"$Lc\"]}],{},null,false,null]},null,false,\"$@d\"]},null,false,\"$@d\"]},null,false,\"$@d\"]},null,false,null],\"$Le\",false]],\"m\":\"$undefined\",\"G\":[\"$f\",[\"$L10\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"g-pGVvcGEV9O4jPvRGyfJ\"}\n"])</script><script>self.__next_f.push([1,"11:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"OutletBoundary\"]\n12:\"$Sreact.suspense\"\n15:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"ViewportBoundary\"]\n17:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"MetadataBoundary\"]\nb:[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/01wgq63w~ml9e.js\",\"async\":true,\"nonce\":\"$undefined\"}]\nc:[\"$\",\"$L11\",null,{\"children\":[\"$\",\"$12\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@13\"}]}]\n14:[]\nd:\"$W14\"\ne:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L15\",null,{\"children\":\"$L16\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L17\",null,{\"children\":[\"$\",\"$12\",null,{\"name\":\"Nex
