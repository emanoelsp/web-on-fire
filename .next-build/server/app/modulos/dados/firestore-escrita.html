":3,\"type\":\"code\",\"tag\":\"Create\",\"title\":\"Criando documentos\",\"codeLabel\":\"criar.ts\",\"code\":\"import { collection, addDoc, doc, setDoc, serverTimestamp } from \\\"firebase/firestore\\\";\\nimport { db } from \\\"@/lib/firebaseConfig\\\";\\n\\n// addDoc — o Firestore gera um ID aleatório\\nconst ref = await addDoc(collection(db, \\\"alunos\\\"), {\\n  nome: \\\"Ana\\\",\\n  xp: 0,\\n  criadoEm: serverTimestamp(), // hora do servidor, confiável\\n});\\nconsole.log(\\\"Novo id:\\\", ref.id);\\n\\n// setDoc — VOCÊ define o ID (ex: usar o uid do Auth)\\nawait setDoc(doc(db, \\\"alunos\\\", user.uid), {\\n  nome: user.displayName,\\n  email: user.email,\\n});\",\"tip\":\"Use addDoc quando o ID não importa (um post, um comentário). Use setDoc quando o ID É significativo — como o uid do usuário logado.\"},{\"id\":4,\"type\":\"code\",\"tag\":\"Update \u0026 Delete\",\"title\":\"Atualizando e removendo\",\"codeLabel\":\"mutacoes.ts\",\"code\":\"import { doc, updateDoc, deleteDoc, increment } from \\\"firebase/firestore\\\";\\nimport { db } from \\\"@/lib/firebaseConfig\\\";\\n\\n// Update — muda SÓ os campos informados (o resto fica intacto)\\nawait updateDoc(doc(db, \\\"alunos\\\", id), {\\n  xp: 500,\\n  ultimoAcesso: new Date().toISOString(),\\n});\\n\\n// increment — soma sem precisar ler antes (atômico!)\\nawait updateDoc(doc(db, \\\"alunos\\\", id), {\\n  xp: increment(50),   // +50 no valor atual, seguro contra concorrência\\n});\\n\\n// Delete — remove o documento inteiro\\nawait deleteDoc(doc(db, \\\"alunos\\\", id));\",\"tip\":\"increment() é ouro: soma direto no servidor sem 'ler-somar-gravar'. Evita bugs quando duas ações mexem no mesmo campo ao mesmo tempo.\"},{\"id\":5,\"type\":\"concept\",\"tag\":\"setDoc merge\",\"title\":\"setDoc vs updateDoc: a pegadinha\",\"items\":[{\"icon\":\"💥\",\"text\":\"setDoc SUBSTITUI o documento inteiro: campos não incluídos são APAGADOS. Cuidado!\"},{\"icon\":\"🩹\",\"text\":\"updateDoc altera só os campos passados — mas FALHA se o documento não existir.\"},{\"icon\":\"✅\",\"text\":\"setDoc(ref, dados, { merge: true }): o melhor dos dois — cria se não existe, mescla se existe.\"},{\"icon\":\"🎯\",\"text\":\"Padrão seguro para 'salvar progresso': setDoc com merge. É o que o saveUserProgress deste curso usa.\"}]},{\"id\":6,\"type\":\"quiz\",\"tag\":\"Quiz\",\"title\":\"A operação certa\",\"question\":\"Você quer aumentar o XP de um aluno em 50, sem risco de sobrescrever se dois eventos acontecerem juntos. O que usar?\",\"options\":[{\"text\":\"Ler o xp, somar 50 no código e gravar com updateDoc\",\"correct\":false,\"explanation\":\"Perigoso: entre ler e gravar, outro evento pode alterar o valor — e você sobrescreve o dele. É a 'race condition'.\"},{\"text\":\"updateDoc com increment(50)\",\"correct\":true,\"explanation\":\"Exato! increment soma no servidor de forma atômica. Dois +50 simultâneos resultam em +100 corretamente.\"},{\"text\":\"deleteDoc e depois addDoc com o novo valor\",\"correct\":false,\"explanation\":\"Isso destrói o histórico, muda o ID e perde os outros campos. Nunca faça isso para um simples incremento.\"},{\"text\":\"setDoc sem merge com { xp: 50 }\",\"correct\":false,\"explanation\":\"setDoc sem merge apagaria nome, email e todo o resto do documento. E 50 não é 'somar 50', é 'virar 50'.\"}],\"xp\":15},{\"id\":7,\"type\":\"concept\",\"tag\":\"Segurança\",\"title\":\"Security Rules: a muralha do banco\",\"items\":[{\"icon\":\"🚨\",\"text\":\"As chaves do Firebase são públicas. Sem regras, QUALQUER um poderia ler/escrever seu banco pelo console do browser.\"},{\"icon\":\"📜\",\"text\":\"Security Rules ficam no Firebase e decidem quem pode o quê — rodam no servidor do Google, invioláveis.\"},{\"icon\":\"🔐\",\"text\":\"Ex: 'só o dono edita o próprio progresso' → allow write: if request.auth.uid == userId.\"},{\"icon\":\"⚠️\",\"text\":\"Modo de teste expira e libera tudo. Antes de publicar de verdade, ESCREVA suas regras. Inegociável.\"}]},{\"id\":8,\"type\":\"code\",\"tag\":\"Regras\",\"title\":\"Um exemplo de Security Rules\",\"codeLabel\":\"firestore.rules\",\"code\":\"rules_version = '2';\\nservice cloud.firestore {\\n  match /databases/{database}/documents {\\n\\n    // Progresso: só o próprio dono lê e escreve\\n    match /progresso/{userId} {\\n      allow read, write: if request.auth != null\\n                         \u0026\u0026 request.auth.uid == userId;\\n    }\\n\\n    // Produtos: qualquer um lê, ninguém escreve pelo cliente\\n    match /produtos/{id} {\\n      allow read: if true;\\n      allow write: if false;  // só via backend/Server Action\\n    }\\n  }\\n}\",\"tip\":\"Regra de ouro: comece negando tudo e libere o mínimo necessário. 'allow write: if false' + escrita só pelo servidor é o padrão mais seguro.\"},{\"id\":9,\"type\":\"fill-blank\",\"tag\":\"Mão na massa\",\"title\":\"Complete a exclusão\",\"instruction\":\"Complete a função do Firestore que remove um documento inteiro (digite só o nome da função):\",\"prefix\":\"import { doc, _________ } from \\\"firebase/firestore\\\";\\n\\nawait _________(doc(db, \\\"alunos\\\", id));\",\"answer\":\"deleteDoc\",\"hint\":\"É 'delete' + 'Doc'.\",\"xp\":20},{\"id\":10,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão 16\",\"title\":\"CRUD\\nCOMPLETO\",\"subtitle\":\"Um cadastro que cria, edita e apaga de verdade\",\"tasks\":[\"Na coleção 'produtos', crie um formulário (/produtos/novo) que grava com addDoc\",\"Use serverTimestamp() para registrar criadoEm em cada produto\",\"Crie um botão 'Editar' que abre um formulário e salva com updateDoc\",\"Crie um botão 'Excluir' que remove com deleteDoc (confirme antes com SweetAlert2!)\",\"Adicione um campo 'estoque' e um botão +1/-1 usando increment()\",\"Escreva Security Rules básicas: leitura pública, escrita só autenticada\"],\"bonus\":[\"Use setDoc com { merge: true } para um formulário que cria OU atualiza\",\"Após cada mutação, dispare um toast (Sonner) de confirmação\"],\"xp\":50,\"nextHref\":\"/modulos/dados/server-actions\",\"nextLabel\":\"Aula 04: Server Actions →\"}],\"backHref\":\"/modulos/dados\",\"backLabel\":\"Persistência \u0026 BaaS\",\"aulaLabel\":\"Aula 03 — Firestore (Escrita e Mutações)\",\"aulaSlug\":\"dados-firestore-escrita\"}],[\"$L7\"],\"$L8\"]}],{},null,false,null]},null,false,\"$@9\"]},null,false,\"$@9\"]},null,false,\"$@9\"]},null,false,null],\"$La\",false]],\"m\":\"$undefined\",\"G\":[\"$b\",[\"$Lc\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"g-pGVvcGEV9O4jPvRGyfJ\"}\n"])</script><script>self.__next_f.push([1,"d:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"OutletBoundary\"]\ne:\"$Sreact.suspense\"\n11:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"ViewportBoundary\"]\n13:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"MetadataBoundary\"]\n7:[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/01wgq63w~ml9e.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n8:[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$e\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@f\"}]}]\n10:[]\n9:\"$W10\"\na:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L11\",null,{\"children\":\"$L12\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L13\",null,{\"children\":[\"$\",\"$e\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L14\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\nc:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/154mv0jpvr9bj.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\"
