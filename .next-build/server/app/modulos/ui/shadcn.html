lo é doloroso.\"},{\"icon\":\"💡\",\"text\":\"Headless UI separou as duas coisas: entrega o COMPORTAMENTO (acessível, testado) e deixa o VISUAL 100% com você.\"}]},{\"id\":3,\"type\":\"comparison\",\"tag\":\"Dois mundos\",\"title\":\"Biblioteca tradicional vs Headless\",\"left\":{\"label\":\"UI tradicional (MUI, Bootstrap)\",\"items\":[\"Vem estilizada — visual pronto\",\"Difícil de customizar a fundo\",\"Você luta contra o CSS dela\",\"Bundle grande, tema próprio\",\"Seu app parece 'template'\"]},\"right\":{\"label\":\"Headless (Radix, Headless UI)\",\"items\":[\"Zero estilo — só comportamento\",\"Você estiliza com Tailwind\",\"Acessibilidade de fábrica\",\"Visual 100% da sua marca\",\"Seu app parece SEU\"]},\"tip\":\"Headless = 'sem cabeça (visual)'. Entrega a lógica acessível; a aparência é sua responsabilidade — e sua liberdade.\"},{\"id\":4,\"type\":\"concept\",\"tag\":\"Shadcn/UI\",\"title\":\"A ideia genial do Shadcn/UI\",\"items\":[{\"icon\":\"📦\",\"text\":\"Shadcn NÃO é uma dependência que você instala e importa. É uma coleção de componentes que você COPIA para o seu projeto.\"},{\"icon\":\"🏠\",\"text\":\"O código do Button, Dialog, Input vai para components/ui/ — dentro do SEU repositório. Você é o dono.\"},{\"icon\":\"🔧\",\"text\":\"Precisa mudar algo? Edite o arquivo. Sem esperar release, sem sobrescrever CSS de terceiros, sem !important.\"},{\"icon\":\"🧬\",\"text\":\"Por baixo usa Radix UI (headless, acessível) + Tailwind + o cn() da aula passada. Você já entende as peças!\"}]},{\"id\":5,\"type\":\"code\",\"tag\":\"Setup\",\"title\":\"Adicionando componentes\",\"codeLabel\":\"terminal\",\"code\":\"# Inicializa o Shadcn no projeto (uma vez)\\nnpx shadcn@latest init\\n# → pergunta cor base, cria lib/utils.ts com o cn(), configura tudo\\n\\n# Adiciona SÓ os componentes que você quer — eles viram arquivos seus\\nnpx shadcn@latest add button\\nnpx shadcn@latest add dialog\\nnpx shadcn@latest add input form\\n\\n# Resultado: os arquivos aparecem em components/ui/\\n#   components/ui/button.tsx   ← seu, editável\\n#   components/ui/dialog.tsx   ← seu, editável\\n\\n# Uso normal, como qualquer componente:\\nimport { Button } from \\\"@/components/ui/button\\\";\\n\u003cButton variant=\\\"destructive\\\"\u003eExcluir\u003c/Button\u003e\",\"tip\":\"Você instala só o que usa. Nada de importar uma biblioteca de 300 componentes para usar 3. Cada add é um arquivo no seu controle.\"},{\"id\":6,\"type\":\"code\",\"tag\":\"Na prática\",\"title\":\"Um modal acessível em minutos\",\"codeLabel\":\"ConfirmarExclusao.tsx\",\"code\":\"import {\\n  Dialog, DialogContent, DialogTrigger,\\n  DialogHeader, DialogTitle, DialogFooter,\\n} from \\\"@/components/ui/dialog\\\";\\nimport { Button } from \\\"@/components/ui/button\\\";\\n\\nexport function ConfirmarExclusao() {\\n  return (\\n    \u003cDialog\u003e\\n      \u003cDialogTrigger asChild\u003e\\n        \u003cButton variant=\\\"destructive\\\"\u003eExcluir conta\u003c/Button\u003e\\n      \u003c/DialogTrigger\u003e\\n      \u003cDialogContent\u003e\\n        \u003cDialogHeader\u003e\\n          \u003cDialogTitle\u003eTem certeza absoluta?\u003c/DialogTitle\u003e\\n        \u003c/DialogHeader\u003e\\n        \u003cp className=\\\"text-sm text-slate-500\\\"\u003eEsta ação não pode ser desfeita.\u003c/p\u003e\\n        \u003cDialogFooter\u003e\\n          \u003cButton variant=\\\"ghost\\\"\u003eCancelar\u003c/Button\u003e\\n          \u003cButton variant=\\\"destructive\\\"\u003eSim, excluir\u003c/Button\u003e\\n        \u003c/DialogFooter\u003e\\n      \u003c/DialogContent\u003e\\n    \u003c/Dialog\u003e\\n  );\\n}\\n// Grátis: foco preso no modal, fecha no Esc, clique fora, ARIA correto.\",\"tip\":\"Repare: você não escreveu NENHUMA lógica de abrir/fechar/foco. O Radix cuida. Você só compôs e estilizou.\"},{\"id\":7,\"type\":\"quiz\",\"tag\":\"Quiz\",\"title\":\"Entendendo o Shadcn\",\"question\":\"Qual afirmação sobre o Shadcn/UI é a correta?\",\"options\":[{\"text\":\"É uma dependência no package.json que você importa como qualquer lib\",\"correct\":false,\"explanation\":\"Esse é o modelo tradicional. O Shadcn COPIA o código-fonte para o seu projeto — você vira o dono dos arquivos.\"},{\"text\":\"Copia o código dos componentes para o seu projeto, e você pode editá-los\",\"correct\":true,\"explanation\":\"Exato! É a proposta central: componentes acessíveis (via Radix) que viram SEUS arquivos em components/ui/, livres para editar.\"},{\"text\":\"É um tema visual fixo que não pode ser alterado\",\"correct\":false,\"explanation\":\"Ao contrário: como o código é seu e usa Tailwind, você muda o que quiser.\"},{\"text\":\"Substitui o Tailwind por um sistema de estilo próprio\",\"correct\":false,\"explanation\":\"Ele USA o Tailwind (e o cn()) para estilizar. Não substitui nada — se apoia no que você já sabe.\"}],\"xp\":15},{\"id\":8,\"type\":\"concept\",\"tag\":\"Ecossistema\",\"title\":\"O que você ganha de fábrica\",\"items\":[{\"icon\":\"📝\",\"text\":\"Formulários: Form + React Hook Form + Zod para validação tipada, com mensagens de erro acessíveis.\"},{\"icon\":\"🪟\",\"text\":\"Overlays: Dialog, Sheet (gaveta lateral), Popover, Tooltip, Dropdown — todos com foco e teclado corretos.\"},{\"icon\":\"🎚️\",\"text\":\"Inputs ricos: Select, Combobox, Checkbox, Switch, Slider, Calendar — o que dá trabalho fazer na mão.\"},{\"icon\":\"🍞\",\"text\":\"Feedback: Toast/Sonner e Skeleton para loading — ponte perfeita para a próxima aula.\"}]},{\"id\":9,\"type\":\"fill-blank\",\"tag\":\"Mão na massa\",\"title\":\"Complete o comando\",\"instruction\":\"Complete o comando que adiciona o componente de modal (dialog) do Shadcn ao seu projeto:\",\"prefix\":\"$$ npx shadcn@latest _____ dialog\",\"answer\":\"add\",\"hint\":\"É o subcomando que 'adiciona' um componente aos seus arquivos.\",\"xp\":20},{\"id\":10,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão 11\",\"title\":\"UI ACESSÍVEL\",\"subtitle\":\"Deixe o Radix trabalhar por você\",\"tasks\":[\"Rode npx shadcn@latest init no projeto (note que ele cria/atualiza o lib/utils.ts com cn())\",\"Adicione os componentes: button, input, dialog e form\",\"Crie um formulário de cadastro usando os componentes Input e Button do Shadcn\",\"Crie um modal de confirmação (Dialog) que abre ao clicar em 'Excluir'\",\"Teste a acessibilidade: abra o modal e feche com a tecla Esc, navegue com Tab\",\"Customize a cor de um botão editando diretamente o components/ui/button.tsx\"],\"bonus\":[\"Adicione validação ao formulário com React Hook Form + Zod (o Form do Shadcn integra os dois)\",\"Troque o Dialog por um Sheet (gaveta lateral) e compare a experiência\"],\"xp\":50,\"nextHref\":\"/modulos/ui/microinteracoes\",\"nextLabel\":\"Aula 04: Micro-interações →\"}],\"backHref\":\"/modulos/ui\",\"backLabel\":\"Estilização \u0026 UI\",\"aulaLabel\":\"Aula 03 — Headless UI e Shadcn/UI\",\"aulaSlug\":\"ui-shadcn\"}],[\"$L7\"],\"$L8\"]}],{},null,false,null]},null,false,\"$@9\"]},null,false,\"$@9\"]},null,false,\"$@9\"]},null,false,null],\"$La\",false]],\"m\":\"$undefined\",\"G\":[\"$b\",[\"$Lc\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"g-pGVvcGEV9O4jPvRGyfJ\"}\n"])</script><script>self.__next_f.push([1,"d:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"OutletBoundary\"]\ne:\"$Sreact.suspense\"\n11:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"ViewportBoundary\"]\n13:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"MetadataBoundary\"]\n7:[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/01wgq63w~ml9e.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n8:[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$e\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@f\"}]}
