\":\"🎯\",\"text\":\"3 níveis: toast (discreto), alerta modal (decisão séria), celebração (conquista). Cada um tem sua ferramenta.\"}]},{\"id\":3,\"type\":\"diagram\",\"tag\":\"Espectro do feedback\",\"title\":\"Escolha a intensidade certa\",\"subtitle\":\"Do sussurro discreto ao grito de vitória\",\"layers\":[{\"icon\":\"🍞\",\"label\":\"TOAST — Sonner\",\"desc\":\"Discreto, some sozinho. 'Salvo com sucesso', 'Copiado'. Não interrompe o fluxo.\",\"color\":\"green\",\"connector\":\"a ação é séria e precisa de decisão?\"},{\"icon\":\"⚠️\",\"label\":\"ALERTA MODAL — SweetAlert2\",\"desc\":\"Bloqueia a tela e exige resposta. 'Excluir permanentemente? Sim/Não'.\",\"color\":\"amber\",\"connector\":\"o usuário conquistou algo especial?\"},{\"icon\":\"🎉\",\"label\":\"CELEBRAÇÃO — React Confetti\",\"desc\":\"Recompensa visual. Fim de um desafio, cadastro concluído, conquista desbloqueada.\",\"color\":\"fire\"}],\"tip\":\"Erro comum: usar modal bloqueante para 'Salvo!' (irritante) ou toast para 'Excluir conta?' (perigoso demais). Combine gravidade e intensidade.\"},{\"id\":4,\"type\":\"code\",\"tag\":\"Sonner\",\"title\":\"Toasts com Sonner\",\"codeLabel\":\"toasts.tsx\",\"code\":\"// npm install sonner\\n// 1. No layout raiz, adicione o container UMA vez:\\nimport { Toaster } from \\\"sonner\\\";\\n// \u003cbody\u003e ... \u003cToaster richColors position=\\\"top-right\\\" /\u003e \u003c/body\u003e\\n\\n// 2. Dispare de qualquer lugar (Client Component):\\n\\\"use client\\\";\\nimport { toast } from \\\"sonner\\\";\\n\\ntoast.success(\\\"Aluno cadastrado! 🔥\\\");\\ntoast.error(\\\"Falha ao salvar. Tente novamente.\\\");\\ntoast.info(\\\"Sincronizando progresso...\\\");\\n\\n// Toast de promessa: mostra loading → sucesso/erro sozinho\\ntoast.promise(salvarAluno(dados), {\\n  loading: \\\"Salvando...\\\",\\n  success: \\\"Salvo com sucesso!\\\",\\n  error: \\\"Não foi possível salvar.\\\",\\n});\",\"tip\":\"toast.promise é o favorito para operações assíncronas: um só comando cobre os 3 estados (carregando, ok, erro) automaticamente.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"SweetAlert2\",\"title\":\"Alertas críticos com SweetAlert2\",\"codeLabel\":\"confirmar.tsx\",\"code\":\"// npm install sweetalert2\\nimport Swal from \\\"sweetalert2\\\";\\n\\nasync function excluirAluno(id: string) {\\n  const r = await Swal.fire({\\n    title: \\\"Excluir aluno?\\\",\\n    text: \\\"Esta ação não pode ser desfeita!\\\",\\n    icon: \\\"warning\\\",\\n    showCancelButton: true,\\n    confirmButtonText: \\\"Sim, excluir\\\",\\n    cancelButtonText: \\\"Cancelar\\\",\\n    confirmButtonColor: \\\"#dc2626\\\",\\n  });\\n\\n  if (r.isConfirmed) {\\n    await deletarDoBanco(id);\\n    Swal.fire(\\\"Excluído!\\\", \\\"O aluno foi removido.\\\", \\\"success\\\");\\n  }\\n}\",\"tip\":\"Use o modal bloqueante só para ações destrutivas ou irreversíveis. Ele PARA o usuário de propósito — respeite esse peso.\"},{\"id\":6,\"type\":\"quiz\",\"tag\":\"Quiz\",\"title\":\"A ferramenta certa\",\"question\":\"O usuário acabou de copiar um link para a área de transferência. Qual feedback é o mais adequado?\",\"options\":[{\"text\":\"Um modal bloqueante do SweetAlert2 com botão 'OK'\",\"correct\":false,\"explanation\":\"Exagero! Copiar um link é trivial. Parar a tela e exigir um clique irrita o usuário.\"},{\"text\":\"Um toast discreto do Sonner: 'Link copiado!'\",\"correct\":true,\"explanation\":\"Perfeito: confirma a ação, some sozinho e não interrompe. Feedback proporcional à ação.\"},{\"text\":\"Uma chuva de confete com React Confetti\",\"correct\":false,\"explanation\":\"Celebração é para conquistas reais. Copiar link não é um marco — o confete perde o sentido se aparecer sempre.\"},{\"text\":\"Nenhum feedback — copiar é óbvio\",\"correct\":false,\"explanation\":\"Sem confirmação, o usuário não sabe se funcionou e tenta de novo. Um toast rápido resolve.\"}],\"xp\":15},{\"id\":7,\"type\":\"code\",\"tag\":\"React Confetti\",\"title\":\"Celebrando conquistas\",\"codeLabel\":\"Celebracao.tsx\",\"code\":\"// npm install react-confetti\\n\\\"use client\\\";\\nimport Confetti from \\\"react-confetti\\\";\\nimport { useState, useEffect } from \\\"react\\\";\\n\\nexport function Celebracao({ ativo }: { ativo: boolean }) {\\n  const [tamanho, setTamanho] = useState({ w: 0, h: 0 });\\n\\n  useEffect(() =\u003e {\\n    setTamanho({ w: window.innerWidth, h: window.innerHeight });\\n  }, []);\\n\\n  if (!ativo) return null;\\n  return (\\n    \u003cConfetti\\n      width={tamanho.w}\\n      height={tamanho.h}\\n      recycle={false}          // dispara uma vez e para\\n      numberOfPieces={300}\\n      colors={[\\\"#FF5500\\\", \\\"#FF8C00\\\", \\\"#FFB800\\\"]}\\n    /\u003e\\n  );\\n}\\n// Dispare quando o aluno concluir um desafio, cadastro, missão...\",\"tip\":\"recycle={false} é essencial: sem isso, o confete cai para sempre. Você quer uma explosão de comemoração, não uma nevasca eterna.\"},{\"id\":8,\"type\":\"concept\",\"tag\":\"Regras de ouro\",\"title\":\"Feedback que ajuda, não atrapalha\",\"items\":[{\"icon\":\"⏱️\",\"text\":\"Toasts somem sozinhos (3-4s). Nunca exija fechar manualmente algo informativo.\"},{\"icon\":\"🚫\",\"text\":\"Modal bloqueante SÓ para decisões sérias/irreversíveis. Abusar treina o usuário a clicar 'OK' sem ler.\"},{\"icon\":\"🎉\",\"text\":\"Celebração é rara por design: se tudo comemora, nada é especial. Guarde para conquistas reais.\"},{\"icon\":\"🎨\",\"text\":\"Mantenha a identidade: cores e tom das mensagens seguem a marca (no nosso caso, o fire orange 🔥).\"}]},{\"id\":9,\"type\":\"fill-blank\",\"tag\":\"Mão na massa\",\"title\":\"Complete o toast\",\"instruction\":\"Você quer mostrar uma notificação verde de sucesso com o Sonner. Complete a chamada (digite o método completo até o parêntese, ex: toast.xxx):\",\"prefix\":\"import { toast } from \\\"sonner\\\";\\n\\n_______________(\\\"Cadastro realizado! 🔥\\\");\",\"answer\":\"toast.success\",\"hint\":\"É o objeto toast + o método para mensagens positivas.\",\"xp\":20},{\"id\":10,\"type\":\"mini-challenge\",\"tag\":\"🎯 Missão 12\",\"title\":\"APP QUE\\nCONVERSA\",\"subtitle\":\"Dê voz à sua interface nos 3 níveis\",\"tasks\":[\"Instale sonner, sweetalert2 e react-confetti; adicione o \u003cToaster /\u003e no layout raiz\",\"Num botão 'Salvar', dispare toast.success ao concluir e toast.error ao falhar\",\"Use toast.promise numa operação async simulada (setTimeout) com loading/success/error\",\"Num botão 'Excluir', abra um SweetAlert2 de confirmação antes de agir\",\"Crie um botão 'Concluir desafio' que dispara React Confetti (recycle false) por alguns segundos\",\"Garanta que cada feedback combina com a gravidade da ação (toast x modal x confete)\"],\"bonus\":[\"Personalize as cores do Sonner e do confete com a paleta fire (#FF5500)\",\"Combine: ao concluir o desafio, dispare confete E um toast.success juntos\"],\"xp\":50,\"nextHref\":\"/modulos/ui/dashboards\",\"nextLabel\":\"Aula 05: Visualização de Dados →\"}],\"backHref\":\"/modulos/ui\",\"backLabel\":\"Estilização \u0026 UI\",\"aulaLabel\":\"Aula 04 — Micro-interações e Feedback\",\"aulaSlug\":\"ui-microinteracoes\"}],[\"$L7\"],\"$L8\"]}],{},null,false,null]},null,false,\"$@9\"]},null,false,\"$@9\"]},null,false,\"$@9\"]},null,false,null],\"$La\",false]],\"m\":\"$undefined\",\"G\":[\"$b\",[\"$Lc\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"g-pGVvcGEV9O4jPvRGyfJ\"}\n"])</script><script>self.__next_f.push([1,"d:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"OutletBoundary\"]\ne:\"$Sreact.suspense\"\n11:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"ViewportBoundary\"]\n13:I[97367,[\"/_next/static/chunks/10y4wjnwnffjh.js\",\"/_next/static/chunks/0rcpm6flhlhx8.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\"],\"Metada
