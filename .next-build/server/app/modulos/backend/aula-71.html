TypeScript nativo, sem SQL.\"},{\"icon\":\"🆓\",\"text\":\"O plano gratuito Spark é mais que suficiente para aprender e construir projetos reais de pequeno e médio porte.\"}],\"tip\":\"Firebase ≠ Firestore. Firebase é a plataforma inteira. Firestore é só o banco de dados dentro dela.\"},{\"id\":3,\"type\":\"definition\",\"tag\":\"CONCEITO CHAVE\",\"title\":\"O que é Firestore?\",\"quote\":\"Firestore é um banco de dados NoSQL orientado a documentos. Em vez de tabelas e linhas como no MySQL, você trabalha com Coleções e Documentos — estruturas flexíveis no formato JSON que escalam automaticamente.\",\"highlights\":[\"Coleções\",\"Documentos\",\"NoSQL\",\"JSON\"],\"tip\":\"Pense em Coleção como uma pasta e Documento como um arquivo JSON dentro dela. Simples assim.\"},{\"id\":4,\"type\":\"comparison\",\"tag\":\"SQL vs NOSQL\",\"title\":\"MySQL vs Firestore —\\nQual a diferença?\",\"left\":{\"label\":\"MySQL / Postgres (SQL)\",\"items\":[\"Tabelas com colunas fixas\",\"Todas as linhas têm o mesmo formato\",\"JOINs entre tabelas\",\"Schema rígido — ALTER TABLE\",\"Servidor próprio necessário\",\"Escalabilidade manual\"]},\"right\":{\"label\":\"Firestore (NoSQL)\",\"items\":[\"Coleções de Documentos JSON\",\"Cada doc pode ter campos diferentes\",\"Sub-coleções e referências\",\"Schema flexível — só adiciona campos\",\"Serverless — zero configuração\",\"Escala automática e global\"]},\"tip\":\"Não existe 'melhor'. SQL é ótimo para dados relacionais complexos. NoSQL brilha em dados dinâmicos e escala horizontal.\"},{\"id\":5,\"type\":\"architecture\",\"tag\":\"ESTRUTURA DO FIRESTORE\",\"title\":\"Coleções e\\nDocumentos\",\"subtitle\":\"Como os dados são organizados no Firestore\",\"steps\":[{\"icon\":\"🗂️\",\"text\":\"Coleção: agrupa documentos do mesmo tipo. Ex: /alunos contém todos os alunos do sistema.\"},{\"icon\":\"📄\",\"text\":\"Documento: objeto JSON com ID único. Ex: { nome: 'João', email: 'joao@email.com', telefone: '(11) 9999-9999' }.\"},{\"icon\":\"🔑\",\"text\":\"addDoc() gera o ID automaticamente. setDoc() deixa você escolher. Na maioria dos casos, addDoc() é o mais prático.\"},{\"icon\":\"🌿\",\"text\":\"Sub-coleções: um documento pode conter coleções internas. Útil para dados hierárquicos como turmas → aulas.\"}]},{\"id\":6,\"type\":\"files\",\"tag\":\"PASSO 1 — CREDENCIAIS\",\"title\":\".env.local —\\nGuardando as chaves\",\"codeLabel\":\".env.local (raiz do projeto)\",\"code\":\"# Credenciais do Firebase — NÃO vai para o GitHub (.gitignore já ignora)\\nNEXT_PUBLIC_FIREBASE_API_KEY=AIzaSy...\\nNEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=meu-projeto.firebaseapp.com\\nNEXT_PUBLIC_FIREBASE_PROJECT_ID=meu-projeto\\nNEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=meu-projeto.appspot.com\\nNEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=1234567890\\nNEXT_PUBLIC_FIREBASE_APP_ID=1:1234567890:web:abc123\",\"tip\":\"NEXT_PUBLIC_ torna a variável acessível no navegador. Sem esse prefixo, ela fica só no servidor Next.js.\"},{\"id\":7,\"type\":\"code\",\"tag\":\"PASSO 2 — CONFIGURAÇÃO\",\"title\":\"src/lib/\\nfirebaseConfig.ts\",\"codeLabel\":\"src/lib/firebaseConfig.ts\",\"code\":\"import { initializeApp, getApps, getApp } from \\\"firebase/app\\\";\\nimport { getFirestore } from \\\"firebase/firestore\\\";\\n\\nconst firebaseConfig = {\\n  apiKey:            process.env.NEXT_PUBLIC_FIREBASE_API_KEY,\\n  authDomain:        process.env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,\\n  projectId:         process.env.NEXT_PUBLIC_FIREBASE_PROJECT_ID,\\n  storageBucket:     process.env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,\\n  messagingSenderId: process.env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,\\n  appId:             process.env.NEXT_PUBLIC_FIREBASE_APP_ID,\\n};\\n\\n// Evita inicializar mais de uma vez (Next.js hot reload reinicializa módulos)\\nconst app = getApps().length === 0\\n  ? initializeApp(firebaseConfig)\\n  : getApp();\\n\\nexport const db = getFirestore(app);\",\"tip\":\"getApps().length === 0 evita o erro 'Firebase app already exists' no ambiente de desenvolvimento com hot reload.\"},{\"id\":8,\"type\":\"code\",\"tag\":\"PASSO 3 — TESTE\",\"title\":\"Primeiro documento\\nno Firestore\",\"codeLabel\":\"src/app/modulos/backend/hello-firebase/page.tsx\",\"code\":\"\\\"use client\\\";\\n\\nimport { useState } from \\\"react\\\";\\nimport { collection, addDoc, serverTimestamp } from \\\"firebase/firestore\\\";\\nimport { db } from \\\"@/lib/firebaseConfig\\\";\\n\\nexport default function HelloFirebasePage() {\\n  const [status, setStatus] = useState(\\\"idle\\\");\\n  const [docId, setDocId] = useState(\\\"\\\");\\n\\n  async function testar() {\\n    setStatus(\\\"loading\\\");\\n    try {\\n      const ref = await addDoc(collection(db, \\\"testes\\\"), {\\n        mensagem: \\\"Hello Firebase! 🔥\\\",\\n        timestamp: serverTimestamp(),  // hora do servidor, não do navegador\\n      });\\n      setDocId(ref.id);\\n      setStatus(\\\"success\\\");\\n    } catch (err) {\\n      console.error(err);\\n      setStatus(\\\"error\\\");\\n    }\\n  }\\n\\n  return (\\n    \u003cmain style={{ padding: \\\"2rem\\\" }}\u003e\\n      \u003ch1\u003eHello Firebase 🔥\u003c/h1\u003e\\n      \u003cbutton onClick={testar}\u003eTestar Conexão\u003c/button\u003e\\n      {status === \\\"success\\\" \u0026\u0026 \u003cp\u003e✅ Documento criado! ID: {docId}\u003c/p\u003e}\\n      {status === \\\"error\\\"   \u0026\u0026 \u003cp\u003e❌ Erro — verifique o .env.local\u003c/p\u003e}\\n    \u003c/main\u003e\\n  );\\n}\",\"tip\":\"serverTimestamp() grava a hora exata do servidor Firebase — muito mais confiável que new Date() do navegador para ordenações.\"},{\"id\":9,\"type\":\"best-practices\",\"tag\":\"BOAS PRÁTICAS\",\"title\":\"O que fazer e\\no que evitar\",\"items\":[{\"icon\":\"✅\",\"text\":\"Sempre use variáveis de ambiente para as credenciais — nunca cole a apiKey diretamente no código TypeScript.\"},{\"icon\":\"✅\",\"text\":\"Ative o modo de teste (allow read, write: if true) só em desenvolvimento. Em produção, use regras com autenticação.\"},{\"icon\":\"✅\",\"text\":\"Escolha a região southamerica-east1 (São Paulo) para menor latência nos seus projetos brasileiros.\"},{\"icon\":\"⚠️\",\"text\":\"O modo de teste expira em 30 dias. O Firebase vai te avisar antes — aproveite para aprender as regras de segurança.\"}],\"tip\":\"O Firestore no modo de teste é ideal para aprender. Mas antes de publicar qualquer app real, configure as regras de segurança.\"},{\"id\":10,\"type\":\"quiz\",\"tag\":\"QUIZ 🔥\",\"title\":\"Qual função cria\\num documento?\",\"question\":\"Você quer salvar um novo aluno no Firestore com ID gerado automaticamente. Qual função do Firebase SDK você deve usar?\",\"options\":[{\"text\":\"addDoc(collection(db, 'alunos'), dados)\",\"correct\":true,\"explanation\":\"Correto! addDoc() cria o documento na coleção especificada e retorna a referência com o ID gerado pelo Firebase.\"},{\"text\":\"setDoc(doc(db, 'alunos', id), dados)\",\"correct\":false,\"explanation\":\"setDoc() também salva documentos, mas você precisa fornecer o ID manualmente. Use quando quiser controlar o ID.\"},{\"text\":\"insertDoc(collection(db, 'alunos'), dados)\",\"correct\":false,\"explanation\":\"insertDoc() não existe no SDK do Firestore. Esse padrão lembra SQL — no Firestore use addDoc().\"},{\"text\":\"createDoc(db, 'alunos', dados)\",\"correct\":false,\"explanation\":\"createDoc() não existe. No Firestore as funções de escrita são addDoc(), setDoc() e updateDoc().\"}],\"xp\":15},{\"id\":11,\"type\":\"fill-blank\",\"tag\":\"CÓDIGO NA PRÁTICA\",\"title\":\"Complete o import\\ndo Firestore\",\"instruction\":\"Para criar a instância do banco e exportar como 'db', qual função você importa de 'firebase/firestore'?\",\"prefix\":\"import { initializeApp } from \\\"firebase/app\\\";\\nimport { \",\"suffix\":\" } from \\\"firebase/firestore\\\";\\n\\nconst app = initializeApp(firebaseConfig);\\nexport const db = getFirestore(app);\",\"answer\":\"getFirestore\",\"hint\":\"Começa com 'get' e recebe o app inicializado como
