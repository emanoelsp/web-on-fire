\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L6\",null,{\"slides\":[{\"id\":1,\"type\":\"cover\",\"tag\":\"🔥 Módulo 05 · Aula 03\",\"title\":\"CRUD\\nCOMPLETO\",\"subtitle\":\"Adicione busca, atualização e exclusão ao sistema — evoluindo o mesmo projeto da Aula 5.2.\"},{\"id\":2,\"type\":\"concept\",\"tag\":\"O QUE É CRUD\",\"title\":\"As 4 operações\\nde qualquer sistema\",\"items\":[{\"icon\":\"✅\",\"text\":\"Create — Criar: addDoc() salva um novo documento na coleção. Você já domina isso desde a Aula 5.2.\"},{\"icon\":\"📖\",\"text\":\"Read — Ler: getDoc() busca um documento por ID. getDocs() com query() lista vários com filtros e ordenação.\"},{\"icon\":\"✏️\",\"text\":\"Update — Atualizar: updateDoc() modifica campos específicos de um documento existente sem reescrever tudo.\"},{\"icon\":\"🗑️\",\"text\":\"Delete — Excluir: deleteDoc() remove o documento permanentemente. Sem lixeira automática — confirme antes de usar.\"}],\"tip\":\"Create + Read você já fez. Hoje fecha o CRUD: Update e Delete. Com isso você pode construir qualquer sistema CRUD completo.\"},{\"id\":3,\"type\":\"architecture\",\"tag\":\"FLUXO DE ATUALIZAÇÃO\",\"title\":\"Como funciona\\no Update\",\"subtitle\":\"Do clique do usuário até o Firestore\",\"steps\":[{\"icon\":\"👆\",\"text\":\"Usuário clica em 'Editar' → formulário pré-preenchido com os dados atuais aparece na tela.\"},{\"icon\":\"✏️\",\"text\":\"Usuário modifica os campos e clica em 'Salvar' → handleSubmit dispara.\"},{\"icon\":\"⚙️\",\"text\":\"Service atualizarUsuario(id, dados) é chamado → executa updateDoc(doc(db, 'usuarios', id), dados).\"},{\"icon\":\"🔥\",\"text\":\"Firestore atualiza apenas os campos especificados — os outros permanecem intocados. Sem reescrever o documento inteiro.\"}]},{\"id\":4,\"type\":\"code\",\"tag\":\"UPDATE — CÓDIGO\",\"title\":\"updateDoc —\\nAtualizando dados\",\"codeLabel\":\"src/services/userService.ts (atualizado)\",\"code\":\"import {\\n  collection, addDoc, getDoc, getDocs,\\n  doc, updateDoc, deleteDoc,         // ← novos imports\\n  serverTimestamp, query, orderBy,\\n} from \\\"firebase/firestore\\\";\\nimport { db } from \\\"@/lib/firebaseConfig\\\";\\nimport { UserFormData, User } from \\\"@/types/user\\\";\\n\\nconst COLLECTION = \\\"usuarios\\\";\\n\\n// Atualiza campos específicos — sem reescrever o documento inteiro\\nexport async function atualizarUsuario(\\n  id: string,\\n  dados: Partial\u003cUserFormData\u003e  // Partial = todos os campos opcionais\\n): Promise\u003cvoid\u003e {\\n  await updateDoc(doc(db, COLLECTION, id), dados);\\n}\\n\\n// Lista todos os usuários ordenados por data de criação\\nexport async function listarUsuarios(): Promise\u003cUser[]\u003e {\\n  const q = query(collection(db, COLLECTION), orderBy(\\\"createdAt\\\", \\\"desc\\\"));\\n  const snap = await getDocs(q);\\n  return snap.docs.map(d =\u003e ({ id: d.id, ...d.data() } as User));\\n}\",\"tip\":\"Partial\u003cUserFormData\u003e torna todos os campos opcionais. Você pode atualizar só o telefone sem precisar enviar nome e email.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"DELETE — CÓDIGO\",\"title\":\"deleteDoc —\\nExcluindo documentos\",\"codeLabel\":\"src/services/userService.ts (continua)\",\"code\":\"// Exclui o documento permanentemente\\nexport async function excluirUsuario(id: string): Promise\u003cvoid\u003e {\\n  await deleteDoc(doc(db, COLLECTION, id));\\n}\\n\\n// Busca usuários por nome (case-sensitive no Firestore)\\nexport async function buscarPorNome(nome: string): Promise\u003cUser[]\u003e {\\n  // Técnica: busca documentos onde nome começa com o texto digitado\\n  const q = query(\\n    collection(db, COLLECTION),\\n    orderBy(\\\"nome\\\"),\\n    // startAt e endAt criam um range de busca no Firestore\\n  );\\n  const snap = await getDocs(q);\\n  // Filtra no cliente — para busca simples sem índice composto\\n  return snap.docs\\n    .map(d =\u003e ({ id: d.id, ...d.data() } as User))\\n    .filter(u =\u003e u.nome.toLowerCase().includes(nome.toLowerCase()));\\n}\",\"tip\":\"O Firestore não tem LIKE do SQL. Para busca por texto, filtre no cliente após getDocs() ou use Algolia/Typesense para busca avançada.\"},{\"id\":6,\"type\":\"code\",\"tag\":\"TELA DE LISTAGEM\",\"title\":\"Listagem com\\nEditar e Excluir\",\"codeLabel\":\"Padrão de lista com ações (essencial)\",\"code\":\"\\\"use client\\\";\\n\\nimport { useState, useEffect } from \\\"react\\\";\\nimport { listarUsuarios, excluirUsuario } from \\\"@/services/userService\\\";\\nimport { User } from \\\"@/types/user\\\";\\n\\nexport default function ListaPage() {\\n  const [usuarios, setUsuarios] = useState\u003cUser[]\u003e([]);\\n  const [editando, setEditando] = useState\u003cUser | null\u003e(null);\\n\\n  useEffect(() =\u003e { carregar(); }, []);\\n\\n  async function carregar() {\\n    setUsuarios(await listarUsuarios());\\n  }\\n\\n  async function handleExcluir(id: string) {\\n    if (!confirm(\\\"Excluir este usuário?\\\")) return; // confirmação obrigatória!\\n    await excluirUsuario(id);\\n    carregar(); // recarrega a lista\\n  }\\n\\n  return (\\n    \u003cdiv\u003e\\n      {usuarios.map(u =\u003e (\\n        \u003cdiv key={u.id}\u003e\\n          \u003cspan\u003e{u.nome}\u003c/span\u003e\\n          \u003cbutton onClick={() =\u003e setEditando(u)}\u003e✏️ Editar\u003c/button\u003e\\n          \u003cbutton onClick={() =\u003e handleExcluir(u.id!)}\u003e🗑️ Excluir\u003c/button\u003e\\n        \u003c/div\u003e\\n      ))}\\n      {editando \u0026\u0026 \u003cFormularioEdicao usuario={editando} onSalvar={carregar} /\u003e}\\n    \u003c/div\u003e\\n  );\\n}\",\"tip\":\"confirm() é o jeito mais simples de confirmar exclusão. Em produção, use um modal personalizado para melhor UX.\"},{\"id\":7,\"type\":\"code\",\"tag\":\"FORMULÁRIO DE EDIÇÃO\",\"title\":\"Editando os dados\\nexistentes\",\"codeLabel\":\"FormularioEdicao — pré-preenchido\",\"code\":\"$7\",\"tip\":\"O formulário começa pré-preenchido com os dados atuais (useState com o objeto usuario). Só os campos modificados chegam ao updateDoc.\"},{\"id\":8,\"type\":\"best-practices\",\"tag\":\"BOAS PRÁTICAS\",\"title\":\"Update e Delete\\ncom segurança\",\"items\":[{\"icon\":\"🛡️\",\"text\":\"Sempre confirme antes de excluir — confirm() para protótipos, modal customizado para produção. Nunca delete sem aviso.\"},{\"icon\":\"⚡\",\"text\":\"updateDoc() atualiza só os campos que você passa. setDoc() com { merge: true } faz o mesmo mas reescreve o documento inteiro se não tiver merge.\"},{\"icon\":\"🔄\",\"text\":\"Após qualquer operação de escrita, recarregue a lista — o Firestore tem cache e pode não refletir mudanças imediatamente no getDocs().\"},{\"icon\":\"🔒\",\"text\":\"Em produção, adicione regras de segurança no Firestore para que só o dono do documento possa atualizar ou excluir.\"}],\"tip\":\"Soft delete: em sistemas reais, adicione um campo 'excluido: true' em vez de deletar — facilita auditoria e recuperação de dados.\"},{\"id\":9,\"type\":\"quiz\",\"tag\":\"QUIZ 🔥\",\"title\":\"Qual função\\natualiza um doc?\",\"question\":\"Você quer atualizar apenas o telefone de um usuário sem sobrescrever os outros campos (nome, email). Qual função usar?\",\"options\":[{\"text\":\"updateDoc(doc(db, 'usuarios', id), { telefone: novoTel })\",\"correct\":true,\"explanation\":\"updateDoc() faz merge automático — só atualiza os campos que você passa. Perfeito para edições parciais.\"},{\"text\":\"setDoc(doc(db, 'usuarios', id), { telefone: novoTel })\",\"correct\":false,\"explanation\":\"setDoc() sem { merge: true } SUBSTITUI todo o documento. O nome e email seriam apagados!\"},{\"text\":\"addDoc(collection(db, 'usuarios'), { telefone: novoTel })\",\"correct\":false,\"explanation\":\"addDoc() CRIA um novo documento — não atualiza o existente. Seria um duplicado com ID diferente.\"},{\"text\":\"patchDoc(doc(db, 'usuarios', id), { telefone: novoTel })\",\"correct\":false,\"explanation\":\"patchDoc() não existe no SDK do Firestore. A função de atualização parcial é updateDoc().\"}],\"xp\":15},{\"id\":10,\"type\":\"fill-blank\",\"tag\":\"CÓDIGO NA PRÁTICA\",\"title\":\"Complete a exclusão\\nno service\",\"instruction\":\"Para excluir um documento do Firestore, qual função você usa? (ela recebe a referência do documento como argumento)\",\"prefix\":\"import { doc, \",\"suffix\":\" } from \\\"firebase/firestore\\\";\\n\\nexport async function excluirUsuario(id: string): Promise\u003cvoid\u003e {\\n  await deleteDoc(doc(db, \\\"usuarios\\\", id));\\n}\",\"answer\":\"deleteDoc\",\"hint\":\"É uma função do SDK firebase/firestore. O nome é auto-explicativo: delete + doc.\",\"xp\":20},{\"id\":11,\"type\":\"mini-challenge\",\"tag\":\"MISSÃO 5.3\",\"title\":\"CRUD\\nCOMPLETO\",\"subtitle\":\"Evolua o projeto da Aula 5.2 com busca, edição e exclusão\",\"tasks\":[\"Adicionou atualizarUsuario(id, dados) no userService usando updateDoc()\",\"Adicionou excluirUsuario(id) no userService usando deleteDoc()\",\"Adicionou listarUsuarios() para buscar todos os documentos com orderBy\",\"Criou formulário de edição pré-preenchido com os dados atuais\",\"Implementou exclusão com confirmação antes de deletar\"],\"bonus\":[\"Campo de busca que filtra a lista pelo nome do usuário\",\"Feedback visual (loading) durante operações de escrita\",\"Estado 'editando' que controla qual formulário de edição está aberto\"],\"xp\":50,\"nextHref\":\"/modulos/backend/parte2\",\"nextLabel\":\"Atividade Final →\"}],\"backHref\":\"/modulos/backend\",\"backLabel\":\"Módulo 05\",\"aulaLabel\":\"Aula 03 — CRUD Completo\",\"aulaSlug\":\"backend-aula-83\",\"completionHref\"
