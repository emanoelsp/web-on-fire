diz exatamente quais campos existem e seus tipos.\"},{\"icon\":\"⚙️\",\"text\":\"services/userService.ts — Funções de banco de dados. Aqui fica o addDoc, getDoc, query. A tela nunca toca o Firestore diretamente.\"},{\"icon\":\"🔌\",\"text\":\"lib/firebaseConfig.ts — Conexão com o Firebase. Exporta a instância 'db' que os services usam.\"},{\"icon\":\"🖥️\",\"text\":\"app/atividade-2/page.tsx — A tela. Só cuida do formulário, estado e UX. Chama o service para qualquer operação de banco.\"}],\"tip\":\"A regra de ouro: a tela não sabe o que é addDoc(). O service não sabe o que é useState(). Cada um no seu lugar.\"},{\"id\":4,\"type\":\"code\",\"tag\":\"CAMADA 1 — TYPES\",\"title\":\"src/types/user.ts\\nO contrato dos dados\",\"codeLabel\":\"src/types/user.ts\",\"code\":\"export interface User {\\n  id?: string;       // gerado automaticamente pelo Firestore\\n  nome: string;\\n  email: string;\\n  telefone: string;\\n  createdAt?: Date;  // preenchido pelo serverTimestamp()\\n}\\n\\n// Omit remove os campos que não vêm do formulário\\n// O aluno não digita o id nem o createdAt — eles são automáticos\\nexport type UserFormData = Omit\u003cUser, \\\"id\\\" | \\\"createdAt\\\"\u003e;\",\"tip\":\"Omit\u003cUser, 'id' | 'createdAt'\u003e cria um novo tipo com todos os campos de User, exceto id e createdAt. Elegante e seguro.\"},{\"id\":5,\"type\":\"code\",\"tag\":\"CAMADA 2 — SERVICE\",\"title\":\"src/services/\\nuserService.ts\",\"codeLabel\":\"src/services/userService.ts\",\"code\":\"import { collection, addDoc, getDoc, doc, serverTimestamp } from \\\"firebase/firestore\\\";\\nimport { db } from \\\"@/lib/firebaseConfig\\\";\\nimport { UserFormData, User } from \\\"@/types/user\\\";\\n\\nconst COLLECTION = \\\"usuarios\\\";\\n\\n// Cria um novo usuário e retorna o ID gerado pelo Firestore\\nexport async function cadastrarUsuario(dados: UserFormData): Promise\u003cstring\u003e {\\n  const docRef = await addDoc(collection(db, COLLECTION), {\\n    ...dados,                    // espalha nome, email, telefone\\n    createdAt: serverTimestamp() // timestamp do servidor\\n  });\\n  return docRef.id;\\n}\\n\\n// Busca um usuário pelo ID\\nexport async function buscarUsuario(id: string): Promise\u003cUser | null\u003e {\\n  const snap = await getDoc(doc(db, COLLECTION, id));\\n  if (!snap.exists()) return null;\\n  return { id: snap.id, ...snap.data() } as User;\\n}\",\"tip\":\"...dados usa o spread operator para copiar todos os campos do formulário sem listar cada um. Prático quando o objeto cresce.\"},{\"id\":6,\"type\":\"code\",\"tag\":\"CAMADA 4 — TELA\",\"title\":\"Formulário de\\ncadastro\",\"codeLabel\":\"src/app/atividade-2/page.tsx (essencial)\",\"code\":\"$7\",\"tip\":\"handleChange usa e.target.name para saber qual campo atualizar. Um único handler para todos os inputs — sem repetir código.\"},{\"id\":7,\"type\":\"code\",\"tag\":\"ROTA DINÂMICA\",\"title\":\"Página de perfil —\\n/perfil/[id]\",\"codeLabel\":\"src/app/perfil/[id]/page.tsx\",\"code\":\"// Sem \\\"use client\\\" — este é um Server Component\\n// O Next.js busca os dados no servidor antes de enviar o HTML\\nimport { buscarUsuario } from \\\"@/services/userService\\\";\\nimport { notFound } from \\\"next/navigation\\\";\\n\\ninterface Props {\\n  params: Promise\u003c{ id: string }\u003e; // Next.js 15+ — params é Promise\\n}\\n\\nexport default async function PerfilPage({ params }: Props) {\\n  const { id } = await params;\\n  const usuario = await buscarUsuario(id);\\n\\n  if (!usuario) notFound(); // retorna 404 se não encontrar\\n\\n  return (\\n    \u003cmain\u003e\\n      \u003ch1\u003e✅ Cadastro realizado!\u003c/h1\u003e\\n      \u003cp\u003eID Firestore: {id}\u003c/p\u003e\\n      \u003cp\u003eNome: {usuario.nome}\u003c/p\u003e\\n      \u003cp\u003eE-mail: {usuario.email}\u003c/p\u003e\\n      \u003cp\u003eTelefone: {usuario.telefone}\u003c/p\u003e\\n    \u003c/main\u003e\\n  );\\n}\",\"tip\":\"Server Component é mais seguro e rápido: o Firestore é acessado no s
